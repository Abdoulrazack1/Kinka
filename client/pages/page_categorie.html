<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Redirection — KINKA.FR</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/images/LogoProjetFilRouge.png">
<link rel="stylesheet" href="../assets/css/kinka-shared.css">
    <!-- Thème appliqué avant le premier rendu. darkmode.js est chargé en fin de
         page : la classe n'arrivait qu'au DOMContentLoaded, après un premier
         affichage en clair — soit un flash blanc à chaque navigation pour qui
         utilise le thème sombre. Ce bloc doit rester synchrone et dans <head>.
         La préférence n'est pas écrite ici : seul un clic la fixe. -->
    <script>
    (function(){try{
        var choix = localStorage.getItem('kinka_darkmode');
        var sombre = choix !== null
            ? choix === '1'
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (sombre) document.documentElement.classList.add('pre-dark-mode');
    }catch(e){}})();
    </script>
</head>
<body>
<!--
  Page conservée uniquement comme redirection : remplacée par le catalogue filtré.
  Son contenu dupliquait celui de la page de destination et divergeait au fil
  des modifications. Les anciens liens et favoris restent valides.
-->
<main class="container" style="text-align:center;padding:4rem 1rem">
  <p>Cette page a été remplacée. Redirection en cours…</p>
  <p><a id="destination" href="./page_catalogue.html">Continuer</a></p>
</main>
<script>
(function () {
  var destination = "./page_catalogue.html";
  
  // Conserve le paramètre d'origine pour arriver sur le bon contenu.
  var valeur = new URLSearchParams(location.search).get("categorie");
  if (valeur) {
    destination += (destination.indexOf('?') === -1 ? '?' : '&') +
                   "categorie" + '=' + encodeURIComponent(valeur);
  }
  document.getElementById('destination').href = destination;
  location.replace(destination);   // replace : la page morte ne pollue pas l'historique
})();
</script>
</body>
</html>
