    <!-- Material Symbols -->

    <link rel="stylesheet" href="../assets/css/translate.css">
    <link rel="stylesheet" href="../assets/css/contraste-clair.css">
    <link rel="stylesheet" href="../assets/css/darkmode.css">
    <!-- Thème appliqué avant le premier rendu. darkmode.js est chargé en fin de
         page : la classe n'arrivait qu'au DOMContentLoaded, après un premier
         affichage en clair — soit un flash blanc à chaque navigation pour qui
         utilise le thème sombre. Ce bloc doit rester synchrone et dans <head>.
         La préférence n'est pas écrite ici : seul un clic la fixe. -->
    <script>
    (function(){try{
        var choix = localStorage.getItem('kinka_darkmode');
        var sombre = choix !== null
            ? choix === '1'
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (sombre) document.documentElement.classList.add('pre-dark-mode');
    }catch(e){}})();
    </script>
</head>
<body>

    <div class="breadcrumb-bar">

    <!-- MAIN CONTENT -->

        <!-- SEARCH RESULTS HEADER -->

    <script>
    // Header scroll effect
    (function(){
        var h = document.querySelector('header');
        if (!h) return;
        window.addEventListener('scroll', function(){
            h.classList.toggle('scrolled', window.scrollY > 10);
        }, {passive: true});
    })();
