<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1226" viewBox="0 0 1600 1226">
<rect width="1600" height="1226" fill="#FFFFFF"/>
<rect width="1600" height="1200" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Mise en page et responsive</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Grille, points de rupture et règles d'adaptation.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Points de rupture</text><text x="56" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Trois seuils seulement. Ils correspondent aux usages réels, pas à des modèles d'appareils.</text><rect x="56" y="250" width="482" height="216" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="82" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Mobile</text><rect x="82" y="306" width="76.56" height="24" rx="12.0" fill="#fdeef5"/><text x="120.28" y="322" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#E03B8B" font-weight="600" text-anchor="middle">&lt; 768 px</text><text x="236" y="322" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">2 colonnes</text><text x="82" y="368" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Filtres repliés derrière un bouton. Navigation en bas d'écran.</text><text x="82" y="387" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Action principale en pleine largeur.</text><rect x="562" y="250" width="482" height="216" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="588" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Tablette</text><rect x="588" y="306" width="110.66" height="24" rx="12.0" fill="#fdeef5"/><text x="643.33" y="322" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#E03B8B" font-weight="600" text-anchor="middle">768 – 1200 px</text><text x="742" y="322" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">3 à 4 colonnes</text><text x="588" y="368" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Filtres en panneau latéral rétractable. En-tête complet, recherche</text><text x="588" y="387" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">visible.</text><rect x="1068" y="250" width="482" height="216" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="1094" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Bureau</text><rect x="1094" y="306" width="83.38" height="24" rx="12.0" fill="#fdeef5"/><text x="1135.69" y="322" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#E03B8B" font-weight="600" text-anchor="middle">&gt; 1200 px</text><text x="1248" y="322" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">5 colonnes</text><text x="1094" y="368" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Filtres affichés en permanence à gauche. Contenu centré, largeur</text><text x="1094" y="387" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">maximale 1280 px.</text><text x="56" y="512" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">La grille</text><text x="56" y="538" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Contenu centré, largeur maximale 1280 px, marges de 28 px, gouttière de 20 px.</text><rect x="56" y="566" width="1488" height="220" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="140" y="600" width="1220" height="150" rx="8" fill="#f3f4f6"/><rect x="140.0" y="614" width="228.0" height="122" rx="8" fill="#fdeef5" stroke="#f472b6" stroke-width="1"/><text x="254.0" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="middle">col 1</text><rect x="388.0" y="614" width="228.0" height="122" rx="8" fill="#fdeef5" stroke="#f472b6" stroke-width="1"/><text x="502.0" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="middle">col 2</text><rect x="636.0" y="614" width="228.0" height="122" rx="8" fill="#fdeef5" stroke="#f472b6" stroke-width="1"/><text x="750.0" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="middle">col 3</text><rect x="884.0" y="614" width="228.0" height="122" rx="8" fill="#fdeef5" stroke="#f472b6" stroke-width="1"/><text x="998.0" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="middle">col 4</text><rect x="1132.0" y="614" width="228.0" height="122" rx="8" fill="#fdeef5" stroke="#f472b6" stroke-width="1"/><text x="1246.0" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="middle">col 5</text><text x="76" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">28 px</text><text x="1500" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="end">28 px</text><text x="56" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Règles d'adaptation, écran par écran</text><rect x="56" y="872" width="728" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="872" width="4" height="80" rx="2" fill="#E03B8B"/><text x="80" y="902" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Catalogue</text><text x="80" y="926" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les filtres passent d'un panneau latéral permanent à un bouton qui ouvre un panneau glissant.</text><rect x="816" y="872" width="728" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="816" y="872" width="4" height="80" rx="2" fill="#E03B8B"/><text x="840" y="902" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Fiche produit</text><text x="840" y="926" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les deux colonnes (visuel / achat) s'empilent. Le bouton d'ajout occupe toute la largeur.</text><rect x="56" y="968" width="728" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="968" width="4" height="80" rx="2" fill="#E03B8B"/><text x="80" y="998" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Panier</text><text x="80" y="1022" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le récapitulatif passe sous les articles et devient collant en bas d'écran.</text><rect x="816" y="968" width="728" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="816" y="968" width="4" height="80" rx="2" fill="#E03B8B"/><text x="840" y="998" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Paiement</text><text x="840" y="1022" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les champs passent d'une grille à deux colonnes à une colonne unique.</text><rect x="56" y="1064" width="728" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="1064" width="4" height="80" rx="2" fill="#E03B8B"/><text x="80" y="1094" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Back-office</text><text x="80" y="1118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La navigation latérale se replie ; les tableaux défilent horizontalement plutôt que de se compresser.</text><rect x="816" y="1064" width="728" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="816" y="1064" width="4" height="80" rx="2" fill="#E03B8B"/><text x="840" y="1094" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">En-tête</text><text x="840" y="1118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La recherche se réduit à une icône ; les liens rejoignent un menu.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1199" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Mise en page et responsive  —  1600 × 1200</text>
</svg>