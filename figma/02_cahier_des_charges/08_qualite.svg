<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1166" viewBox="0 0 1600 1166">
<rect width="1600" height="1166" fill="#FFFFFF"/>
<rect width="1600" height="1140" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Exigences de qualité</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Accessibilité, performance, éco-conception, référencement et données personnelles.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="482" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="482" height="46" rx="12" fill="#E03B8B"/><rect x="56" y="216" width="482" height="16" rx="0" fill="#E03B8B"/><text x="82" y="216" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">ACCESSIBILITÉ</text><circle cx="88" cy="260" r="3" fill="#E03B8B"/><text x="102" y="264" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Contrastes conformes au niveau AA (4,5:1 sur le texte courant)</text><text x="102" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">sur les deux thèmes — vérifié, trois gris ont été assombris à</text><text x="102" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">cette occasion.</text><circle cx="88" cy="324" r="3" fill="#E03B8B"/><text x="102" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Structure sémantique : header, nav, main, section, footer — pas</text><text x="102" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">de division générique là où une balise existe.</text><circle cx="88" cy="370" r="3" fill="#E03B8B"/><text x="102" y="374" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Tout élément interactif porte un libellé accessible</text><text x="102" y="392" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">(aria-label) et un état (aria-pressed).</text><circle cx="88" cy="416" r="3" fill="#E03B8B"/><text x="102" y="420" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Navigation possible au clavier, ordre de tabulation cohérent,</text><text x="102" y="438" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">focus visible.</text><circle cx="88" cy="462" r="3" fill="#E03B8B"/><text x="102" y="466" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Textes alternatifs sur les couvertures ; une image décorative</text><text x="102" y="484" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">reste vide plutôt que redondante.</text><rect x="562" y="186" width="482" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="562" y="186" width="482" height="46" rx="12" fill="#2563EB"/><rect x="562" y="216" width="482" height="16" rx="0" fill="#2563EB"/><text x="588" y="216" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">PERFORMANCE</text><circle cx="594" cy="260" r="3" fill="#2563EB"/><text x="608" y="264" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le catalogue est paginé : jamais plus de résultats chargés que</text><text x="608" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">ceux affichés.</text><circle cx="594" cy="306" r="3" fill="#2563EB"/><text x="608" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Filtrage et tri exécutés par la base, pas par le navigateur.</text><circle cx="594" cy="334" r="3" fill="#2563EB"/><text x="608" y="338" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Index sur les colonnes les plus filtrées : catégorie, état,</text><text x="608" y="356" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">indicateurs commerciaux, statut.</text><circle cx="594" cy="380" r="3" fill="#2563EB"/><text x="608" y="384" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Couvertures servies depuis un cache local plutôt que depuis un</text><text x="608" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">service tiers.</text><circle cx="594" cy="426" r="3" fill="#2563EB"/><text x="608" y="430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ressources statiques mises en cache une semaine en production.</text><rect x="1068" y="186" width="482" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1068" y="186" width="482" height="46" rx="12" fill="#059669"/><rect x="1068" y="216" width="482" height="16" rx="0" fill="#059669"/><text x="1094" y="216" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">ÉCO-CONCEPTION</text><circle cx="1100" cy="260" r="3" fill="#059669"/><text x="1114" y="264" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Aucune bibliothèque d'interface externe : le poids transféré</text><text x="1114" y="282" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">reste faible.</text><circle cx="1100" cy="306" r="3" fill="#059669"/><text x="1114" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Images dimensionnées pour leur usage réel, pas redimensionnées</text><text x="1114" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">par le navigateur.</text><circle cx="1100" cy="352" r="3" fill="#059669"/><text x="1114" y="356" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Pas de police décorative supplémentaire : une seule famille sur</text><text x="1114" y="374" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">tout le site.</text><circle cx="1100" cy="398" r="3" fill="#059669"/><text x="1114" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Requêtes ciblées : on ne récupère que les colonnes et les</text><text x="1114" y="420" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">lignes affichées.</text><rect x="56" y="656" width="482" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="656" width="482" height="46" rx="12" fill="#C2410C"/><rect x="56" y="686" width="482" height="16" rx="0" fill="#C2410C"/><text x="82" y="686" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">RÉFÉRENCEMENT</text><circle cx="88" cy="730" r="3" fill="#C2410C"/><text x="102" y="734" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Titres hiérarchisés, un seul h1 par page, structure sémantique</text><text x="102" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">respectée.</text><circle cx="88" cy="776" r="3" fill="#C2410C"/><text x="102" y="780" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">URL lisibles et stables, identifiants de produit explicites.</text><circle cx="88" cy="804" r="3" fill="#C2410C"/><text x="102" y="808" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Limite connue : le contenu des fiches étant injecté en</text><text x="102" y="826" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">JavaScript, un moteur qui n'exécute pas les scripts verra une</text><text x="102" y="844" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">page vide. Un rendu côté serveur serait nécessaire pour un vrai</text><text x="102" y="862" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">référencement marchand.</text><rect x="562" y="656" width="482" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="562" y="656" width="482" height="46" rx="12" fill="#7C3AED"/><rect x="562" y="686" width="482" height="16" rx="0" fill="#7C3AED"/><text x="588" y="686" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">DONNÉES PERSONNELLES</text><circle cx="594" cy="730" r="3" fill="#7C3AED"/><text x="608" y="734" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Collecte minimale : identité, coordonnées de livraison, rien de</text><text x="608" y="752" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">plus.</text><circle cx="594" cy="776" r="3" fill="#7C3AED"/><text x="608" y="780" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Mots de passe hachés avec bcrypt ; jetons d'email stockés en</text><text x="608" y="798" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">empreinte SHA-256.</text><circle cx="594" cy="822" r="3" fill="#7C3AED"/><text x="608" y="826" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Suppression de compte effective : les cascades effacent</text><text x="608" y="844" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">réellement panier, favoris, avis, annonces et commandes.</text><circle cx="594" cy="868" r="3" fill="#7C3AED"/><text x="608" y="872" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Consentement aux cookies demandé avant tout dépôt non</text><text x="608" y="890" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">essentiel.</text><circle cx="594" cy="914" r="3" fill="#7C3AED"/><text x="608" y="918" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Reste à produire pour une conformité complète : politique de</text><text x="608" y="936" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">confidentialité rédigée, registre des traitements, durées de</text><text x="608" y="954" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">conservation, export des données.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1139" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1158" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Exigences de qualité  —  1600 × 1140</text>
</svg>