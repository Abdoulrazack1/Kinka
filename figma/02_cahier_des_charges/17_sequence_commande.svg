<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1186" viewBox="0 0 1900 1186">
<rect width="1900" height="1186" fill="#FFFFFF"/>
<rect width="1900" height="1160" fill="#FFFFFF"/>
<g><rect x="0" y="0" width="1900" height="150" rx="0" fill="#FFFFFF"/><rect x="56" y="44" width="5" height="52" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CONCEPTION DES DONNÉES  ·  KINKA.FR</text><text x="76" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#1a1a1a" font-weight="800" text-anchor="start">Séquence — accès concurrent au stock</text><text x="76" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">Deux clients valident au même instant alors qu'il reste un seul exemplaire. Le verrou d'écriture pris par la transaction A fait attendre la B, qui lit ensuite un stock à zéro et se voit refusée.</text><line x1="56" y1="150" x2="1844" y2="150" stroke="#e5e7eb" stroke-width="1"/><rect x="60" y="190" width="260" height="46" rx="8" fill="#2563EB"/><text x="190" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Client A</text><line x1="190" y1="236" x2="190" y2="1010" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="340" y="190" width="260" height="46" rx="8" fill="#C2410C"/><text x="470" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">Client B</text><line x1="470" y1="236" x2="470" y2="1010" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="750" y="190" width="260" height="46" rx="8" fill="#E03B8B"/><text x="880" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">API — commandeModel</text><line x1="880" y1="236" x2="880" y2="1010" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1170" y="190" width="260" height="46" rx="8" fill="#059669"/><text x="1300" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="middle">MySQL / InnoDB</text><line x1="1300" y1="236" x2="1300" y2="1010" stroke="#d1d5db" stroke-width="1.4" stroke-dasharray="6 5"/><rect x="1286" y="400" width="28" height="300" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/><text x="1326" y="386" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#DC2626" font-weight="700" text-anchor="start">Verrou posé sur la ligne produit #42</text><text x="1326" y="404" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="400" text-anchor="start">par le SELECT … FOR UPDATE</text><line x1="190" y1="280" x2="880" y2="280" stroke="#2563EB" stroke-width="1.6"/><polygon points="880,280 872,275 872,285" fill="#2563EB"/><text x="535.0" y="270" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">POST /api/commandes</text><line x1="470" y1="320" x2="880" y2="320" stroke="#C2410C" stroke-width="1.6"/><polygon points="880,320 872,315 872,325" fill="#C2410C"/><text x="675.0" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">POST /api/commandes  (même instant)</text><line x1="880" y1="400" x2="1300" y2="400" stroke="#2563EB" stroke-width="1.6"/><polygon points="1300,400 1292,395 1292,405" fill="#2563EB"/><text x="1090.0" y="390" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">BEGIN  ·  SELECT … FOR UPDATE   (transaction A)</text><line x1="880" y1="450" x2="1300" y2="450" stroke="#C2410C" stroke-width="1.6"/><polygon points="1300,450 1292,445 1292,455" fill="#C2410C"/><text x="1090.0" y="440" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">BEGIN  ·  SELECT … FOR UPDATE   (transaction B)</text><rect x="1326" y="470" width="300" height="44" rx="8" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/><text x="1342" y="498" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#C2410C" font-weight="700" text-anchor="start">B est mise en attente du verrou</text><rect x="970" y="540" width="300" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/><text x="986" y="568" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#2563EB" font-weight="600" text-anchor="start">A lit stock = 1  →  1 ≥ 1, elle peut passer</text><line x1="880" y1="620" x2="1300" y2="620" stroke="#2563EB" stroke-width="1.6"/><polygon points="1300,620 1292,615 1292,625" fill="#2563EB"/><text x="1090.0" y="610" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">UPDATE produits SET stock = stock − 1 WHERE id = ? AND stock &gt;= ?</text><text x="910" y="646" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5b6472" font-weight="400" text-anchor="start">→ 1 ligne affectée : le décrément conditionnel a tenu</text><line x1="880" y1="700" x2="1300" y2="700" stroke="#2563EB" stroke-width="1.6"/><polygon points="1300,700 1292,695 1292,705" fill="#2563EB"/><text x="1090.0" y="690" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">COMMIT   (transaction A)</text><rect x="1326" y="668" width="300" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1"/><text x="1342" y="696" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#059669" font-weight="700" text-anchor="start">Verrou libéré  ·  stock = 0</text><line x1="1300" y1="770" x2="880" y2="770" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="880,770 888,765 888,775" fill="#C2410C"/><text x="1090.0" y="760" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">le SELECT … FOR UPDATE de B se débloque et lit stock = 0</text><rect x="970" y="800" width="300" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/><text x="986" y="828" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#DC2626" font-weight="700" text-anchor="start">0 &lt; 1  →  rupture détectée</text><line x1="880" y1="880" x2="1300" y2="880" stroke="#C2410C" stroke-width="1.6"/><polygon points="1300,880 1292,875 1292,885" fill="#C2410C"/><text x="1090.0" y="870" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">ROLLBACK   (transaction B)</text><line x1="880" y1="940" x2="190" y2="940" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="190,940 198,935 198,945" fill="#2563EB"/><text x="535.0" y="930" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">201  ·  commande CMD-2026-0042 créée</text><line x1="880" y1="985" x2="470" y2="985" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="470,985 478,980 478,990" fill="#C2410C"/><text x="675.0" y="975" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="middle">400  ·  « Stock insuffisant (disponible : 0) »</text><rect x="56" y="1050" width="1788" height="86" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="1050" width="5" height="86" rx="2.5" fill="#E03B8B"/><text x="84" y="1084" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="700" text-anchor="start">Résultat attendu, et vérifié au jeu d’essai</text><text x="84" y="1110" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Une seule commande aboutit, l'autre reçoit un refus explicite, et le stock finit à zéro — jamais en négatif. Sans le verrou, les deux transactions passaient le contrôle avant qu'aucune n'ait décrémenté.</text></g>
<rect x="0.5" y="0.5" width="1899" height="1159" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1178" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Conception des données — Séquence — accès concurrent au stock  —  1900 × 1160</text>
</svg>