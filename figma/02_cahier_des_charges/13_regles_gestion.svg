<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1286" viewBox="0 0 1600 1286">
<rect width="1600" height="1286" fill="#FFFFFF"/>
<rect width="1600" height="1260" fill="#FFFFFF"/>
<g><rect x="0" y="0" width="1600" height="150" rx="0" fill="#FFFFFF"/><rect x="56" y="44" width="5" height="52" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#1a1a1a" font-weight="800" text-anchor="start">Règles de gestion</text><text x="76" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">Les règles métier que le code doit appliquer, énoncées avant de le lire. Une règle non écrite ici est une règle qui dérivera.</text><line x1="56" y1="150" x2="1544" y2="150" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="190" width="482" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="190" width="482" height="46" rx="12" fill="#DC2626"/><rect x="56" y="220" width="482" height="16" rx="0" fill="#DC2626"/><text x="82" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">STOCK</text><circle cx="88" cy="266" r="3" fill="#DC2626"/><text x="102" y="270" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le stock affiché est le stock réel, en nombre d'exemplaires.</text><circle cx="88" cy="296" r="3" fill="#DC2626"/><text x="102" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Une commande ne peut jamais faire passer un stock en négatif.</text><circle cx="88" cy="326" r="3" fill="#DC2626"/><text x="102" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le stock est décrémenté à la validation, pas à la mise au</text><text x="102" y="348" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">panier : un panier ne réserve rien.</text><circle cx="88" cy="374" r="3" fill="#DC2626"/><text x="102" y="378" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Deux commandes simultanées sur le dernier exemplaire : une</text><text x="102" y="396" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">seule aboutit, l'autre reçoit un refus explicite avec la</text><text x="102" y="414" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">quantité disponible.</text><circle cx="88" cy="440" r="3" fill="#DC2626"/><text x="102" y="444" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Quantité plafonnée à 3 exemplaires du même titre par commande.</text><rect x="562" y="190" width="482" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="562" y="190" width="482" height="46" rx="12" fill="#C2410C"/><rect x="562" y="220" width="482" height="16" rx="0" fill="#C2410C"/><text x="588" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">PRIX ET REMISES</text><circle cx="594" cy="266" r="3" fill="#C2410C"/><text x="608" y="270" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le prix affiché est toujours le prix final, taxes comprises.</text><circle cx="594" cy="296" r="3" fill="#C2410C"/><text x="608" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un prix barré n'apparaît jamais seul : le prix promotionnel est</text><text x="608" y="318" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">à côté.</text><circle cx="594" cy="344" r="3" fill="#C2410C"/><text x="608" y="348" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le prix et le titre sont recopiés dans la ligne de commande :</text><text x="608" y="366" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">une commande passée reste fidèle à ce que le client a payé,</text><text x="608" y="384" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">même si le catalogue change.</text><circle cx="594" cy="410" r="3" fill="#C2410C"/><text x="608" y="414" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La remise Premium de 10 % s'applique au sous-total, avant les</text><text x="608" y="432" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">frais de port.</text><rect x="1068" y="190" width="482" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1068" y="190" width="482" height="46" rx="12" fill="#2563EB"/><rect x="1068" y="220" width="482" height="16" rx="0" fill="#2563EB"/><text x="1094" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">PANIER</text><circle cx="1100" cy="266" r="3" fill="#2563EB"/><text x="1114" y="270" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Visiteur : panier conservé dans le navigateur.</text><circle cx="1100" cy="296" r="3" fill="#2563EB"/><text x="1114" y="300" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Membre : panier conservé en base, retrouvé sur tout appareil.</text><circle cx="1100" cy="326" r="3" fill="#2563EB"/><text x="1114" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">À la connexion, le panier local est fusionné dans le compte</text><text x="1114" y="348" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">puis vidé — un visiteur ne perd jamais sa sélection en se</text><text x="1114" y="366" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">connectant.</text><circle cx="1100" cy="392" r="3" fill="#2563EB"/><text x="1114" y="396" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un article devenu indisponible reste visible dans le panier,</text><text x="1114" y="414" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">signalé, et bloque la validation tant qu'il n'est pas retiré.</text><rect x="56" y="690" width="482" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="690" width="482" height="46" rx="12" fill="#059669"/><rect x="56" y="720" width="482" height="16" rx="0" fill="#059669"/><text x="82" y="720" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">COMMANDE</text><circle cx="88" cy="766" r="3" fill="#059669"/><text x="102" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Numéro lisible de la forme CMD-2026-0042, unique et sans</text><text x="102" y="788" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">doublon possible.</text><circle cx="88" cy="814" r="3" fill="#059669"/><text x="102" y="818" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Six statuts, et six seulement : en cours, validée, préparée,</text><text x="102" y="836" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">expédiée, livrée, annulée.</text><circle cx="88" cy="862" r="3" fill="#059669"/><text x="102" y="866" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Livraison offerte à partir de 50 € ; 4,90 € en deçà.</text><circle cx="88" cy="892" r="3" fill="#059669"/><text x="102" y="896" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Une commande est immuable une fois validée : seuls le statut et</text><text x="102" y="914" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">le numéro de suivi évoluent.</text><circle cx="88" cy="940" r="3" fill="#059669"/><text x="102" y="944" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Tout échec en cours de création annule l'ensemble : jamais de</text><text x="102" y="962" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">commande à moitié créée.</text><rect x="562" y="690" width="482" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="562" y="690" width="482" height="46" rx="12" fill="#7C3AED"/><rect x="562" y="720" width="482" height="16" rx="0" fill="#7C3AED"/><text x="588" y="720" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">COMPTE</text><circle cx="594" cy="766" r="3" fill="#7C3AED"/><text x="608" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Adresse email unique, confirmée par un lien à usage unique.</text><circle cx="594" cy="796" r="3" fill="#7C3AED"/><text x="608" y="800" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Mot de passe : 12 caractères minimum, refusé s'il figure dans</text><text x="608" y="818" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">les fuites connues.</text><circle cx="594" cy="844" r="3" fill="#7C3AED"/><text x="608" y="848" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Dix tentatives de connexion par quart d'heure et par adresse</text><text x="608" y="866" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">IP.</text><circle cx="594" cy="892" r="3" fill="#7C3AED"/><text x="608" y="896" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La suppression du compte efface réellement panier, favoris,</text><text x="608" y="914" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">avis et annonces.</text><rect x="1068" y="690" width="482" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1068" y="690" width="482" height="46" rx="12" fill="#0891B2"/><rect x="1068" y="720" width="482" height="16" rx="0" fill="#0891B2"/><text x="1094" y="720" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#FFFFFF" font-weight="800" text-anchor="start" letter-spacing="1.2">ANNONCES ENTRE MEMBRES</text><circle cx="1100" cy="766" r="3" fill="#0891B2"/><text x="1114" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Réservées aux membres connectés et vérifiés.</text><circle cx="1100" cy="796" r="3" fill="#0891B2"/><text x="1114" y="800" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Trois photos maximum, état obligatoire parmi quatre valeurs.</text><circle cx="1100" cy="826" r="3" fill="#0891B2"/><text x="1114" y="830" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un membre ne modifie et ne retire que ses propres annonces.</text><circle cx="1100" cy="856" r="3" fill="#0891B2"/><text x="1114" y="860" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Une annonce signalée reste visible jusqu'à décision de</text><text x="1114" y="878" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">modération, qui est journalisée.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1259" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Règles de gestion  —  1600 × 1260</text>
</svg>