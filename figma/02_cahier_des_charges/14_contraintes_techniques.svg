<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1146" viewBox="0 0 1600 1146">
<rect width="1600" height="1146" fill="#FFFFFF"/>
<rect width="1600" height="1120" fill="#FFFFFF"/>
<g><rect x="0" y="0" width="1600" height="150" rx="0" fill="#FFFFFF"/><rect x="56" y="44" width="5" height="52" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#1a1a1a" font-weight="800" text-anchor="start">Contraintes techniques</text><text x="76" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">L'environnement imposé, les cibles à couvrir et ce qui est explicitement exclu du périmètre.</text><line x1="56" y1="150" x2="1544" y2="150" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="190" width="740" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="190" width="5" height="300" rx="2.5" fill="#E03B8B"/><text x="82" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Pile technique retenue</text><circle cx="88" cy="254" r="3" fill="#E03B8B"/><text x="102" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Front-end : HTML5, CSS3 et JavaScript natif. Aucun framework ni bibliothèque d'interface externe —</text><text x="102" y="276" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">contrainte d'éco-conception et de maîtrise du rendu.</text><circle cx="88" cy="298" r="3" fill="#E03B8B"/><text x="102" y="302" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-end : Node.js et Express, architecture MVC, API REST.</text><circle cx="88" cy="324" r="3" fill="#E03B8B"/><text x="102" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Données : MySQL 8, moteur InnoDB, requêtes préparées.</text><circle cx="88" cy="350" r="3" fill="#E03B8B"/><text x="102" y="354" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Qualité : ESLint et Prettier, plus un contrôle interdisant tout script écrit dans les pages.</text><circle cx="88" cy="376" r="3" fill="#E03B8B"/><text x="102" y="380" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Versions : Git et dépôt distant GitHub.</text><rect x="828" y="190" width="716" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="854" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Cibles à couvrir</text><circle cx="860" cy="254" r="3" fill="#E03B8B"/><text x="874" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Navigateurs : deux dernières versions de Chrome, Firefox, Edge et Safari.</text><circle cx="860" cy="280" r="3" fill="#E03B8B"/><text x="874" y="284" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Largeurs : de 390 px à 1920 px, avec trois points de rupture (768 et 1200 px).</text><circle cx="860" cy="306" r="3" fill="#E03B8B"/><text x="874" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Thèmes : clair et sombre, le thème système faisant foi par défaut.</text><circle cx="860" cy="332" r="3" fill="#E03B8B"/><text x="874" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Accessibilité : contrastes AA, navigation clavier complète, lecteur d'écran.</text><circle cx="860" cy="358" r="3" fill="#E03B8B"/><text x="874" y="362" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Langue : français ; libellés d'interface traduisibles, documentation technique lue en anglais.</text><text x="56" y="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Ce qui est hors périmètre, et pourquoi</text><text x="56" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Une limite écrite est une décision ; une limite tue est un oubli.</text><rect x="56" y="606" width="740" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="606" width="4" height="112" rx="2" fill="#6b7280"/><text x="78" y="638" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Paiement bancaire réel</text><text x="78" y="662" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La conformité PCI-DSS dépasse le cadre du projet. L'étape existe et crée la commande, mais aucune donnée</text><text x="78" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">bancaire ne circule.</text><rect x="820" y="606" width="740" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="606" width="4" height="112" rx="2" fill="#6b7280"/><text x="842" y="638" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Rendu côté serveur</text><text x="842" y="662" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les fiches étant injectées en JavaScript, un moteur qui n'exécute pas les scripts voit une page vide. Un</text><text x="842" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">référencement marchand réel imposerait un rendu serveur.</text><rect x="56" y="736" width="740" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="736" width="4" height="112" rx="2" fill="#6b7280"/><text x="78" y="768" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Retours et remboursements</text><text x="78" y="792" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La règle est publiée et la demande enregistrée ; le traitement reste manuel.</text><rect x="820" y="736" width="740" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="736" width="4" height="112" rx="2" fill="#6b7280"/><text x="842" y="768" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Facturation comptable</text><text x="842" y="792" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le récapitulatif de commande n'est pas une facture au sens comptable.</text><rect x="56" y="866" width="740" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="866" width="4" height="112" rx="2" fill="#6b7280"/><text x="78" y="898" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Prélèvement Premium</text><text x="78" y="922" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">L'interface d'abonnement existe, le prélèvement récurrent non.</text><rect x="820" y="866" width="740" height="112" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="866" width="4" height="112" rx="2" fill="#6b7280"/><text x="842" y="898" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Conteneurisation</text><text x="842" y="922" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">L'environnement de développement repose sur une pile locale ; aucun environnement partagé ne justifiait</text><text x="842" y="940" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">des conteneurs.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1119" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Contraintes techniques  —  1600 × 1120</text>
</svg>