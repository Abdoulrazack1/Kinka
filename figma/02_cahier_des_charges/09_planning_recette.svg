<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1146" viewBox="0 0 1600 1146">
<rect width="1600" height="1146" fill="#FFFFFF"/>
<rect width="1600" height="1120" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Jalons et critères de recette</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Comment le projet a été découpé, et à quoi on reconnaît qu'une fonctionnalité est terminée.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Les jalons</text><text x="56" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Cinq phases, chacune livrant quelque chose d'utilisable.</text><rect x="56" y="250" width="282" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="90" cy="288" r="18" fill="#E03B8B"/><text x="90" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">1</text><text x="120" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Conception</text><text x="82" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Arborescence, wireframes, maquettes,</text><text x="82" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">design system, modèle de données.</text><text x="350" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="362" y="250" width="282" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="396" cy="288" r="18" fill="#E03B8B"/><text x="396" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">2</text><text x="426" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Interfaces statiques</text><text x="388" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Pages HTML sémantiques, CSS</text><text x="388" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">responsive, thème sombre,</text><text x="388" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">accessibilité.</text><text x="656" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="668" y="250" width="282" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="702" cy="288" r="18" fill="#E03B8B"/><text x="702" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">3</text><text x="732" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Base et API</text><text x="694" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Schéma MySQL, couche d'accès aux</text><text x="694" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">données, points d'entrée REST,</text><text x="694" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">authentification.</text><text x="962" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="974" y="250" width="282" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="1008" cy="288" r="18" fill="#E03B8B"/><text x="1008" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">4</text><text x="1038" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Fonctionnalités métier</text><text x="1000" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Catalogue dynamique, panier, commande</text><text x="1000" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">transactionnelle, annonces,</text><text x="1000" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">back-office.</text><text x="1268" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="1280" y="250" width="282" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="1314" cy="288" r="18" fill="#E03B8B"/><text x="1314" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle">5</text><text x="1344" y="294" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Consolidation</text><text x="1306" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Reprise de sécurité, recette,</text><text x="1306" y="353" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">documentation de déploiement.</text><text x="56" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Définition de « terminé »</text><text x="56" y="516" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Une fonctionnalité n'est livrée que si les six points suivants sont vrais. Aucun n'est optionnel.</text><rect x="56" y="552" width="482" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="88" cy="586" r="11" fill="#ECFDF5"/><text x="88" y="591" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><text x="112" y="591" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Le cas nominal fonctionne</text><text x="82" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le parcours attendu aboutit, avec des données réalistes.</text><rect x="562" y="552" width="482" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="594" cy="586" r="11" fill="#ECFDF5"/><text x="594" y="591" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><text x="618" y="591" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Les cas d'erreur sont traités</text><text x="588" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Chaque refus renvoie un message clair et une issue.</text><rect x="1068" y="552" width="482" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="1100" cy="586" r="11" fill="#ECFDF5"/><text x="1100" y="591" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><text x="1124" y="591" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Les entrées sont validées côté serveur</text><text x="1094" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le contrôle client n'est qu'un confort.</text><rect x="56" y="682" width="482" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="88" cy="716" r="11" fill="#ECFDF5"/><text x="88" y="721" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><text x="112" y="721" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Les droits sont vérifiés</text><text x="82" y="750" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Propriété et rôle contrôlés côté serveur, pas seulement masqués</text><text x="82" y="767" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">dans l'interface.</text><rect x="562" y="682" width="482" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="594" cy="716" r="11" fill="#ECFDF5"/><text x="594" y="721" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><text x="618" y="721" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">L'écran tient à 390 px</text><text x="588" y="750" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le parcours aboutit sur mobile, pas seulement « ça ne casse pas ».</text><rect x="1068" y="682" width="482" height="108" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><circle cx="1100" cy="716" r="11" fill="#ECFDF5"/><text x="1100" y="721" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><text x="1124" y="721" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Le code passe l'analyse statique</text><text x="1094" y="750" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">ESLint sans erreur, formatage appliqué, aucun script en ligne.</text><rect x="56" y="828" width="1488" height="230" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="828" width="5" height="230" rx="2.5" fill="#E03B8B"/><text x="84" y="866" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Le jeu d'essai de référence</text><text x="84" y="892" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le passage de commande, fonctionnalité la plus représentative, est vérifié par douze cas — dont huit cas d'erreur provoqués volontairement.</text><text x="84" y="936" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="800" text-anchor="start">·</text><text x="98" y="936" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Quantité supérieure au stock</text><text x="98" y="956" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">→ Refus, quantité disponible indiquée</text><text x="584" y="936" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="800" text-anchor="start">·</text><text x="598" y="936" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Produit en rupture</text><text x="598" y="956" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">→ Refus explicite</text><text x="1084" y="936" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="800" text-anchor="start">·</text><text x="1098" y="936" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Panier vide</text><text x="1098" y="956" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">→ Refus, code 400</text><text x="84" y="992" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="800" text-anchor="start">·</text><text x="98" y="992" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Commande sans être connecté</text><text x="98" y="1012" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">→ Redirection, panier conservé</text><text x="584" y="992" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="800" text-anchor="start">·</text><text x="598" y="992" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Commande d'un autre client</text><text x="598" y="1012" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">→ Introuvable, code 404</text><text x="1084" y="992" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="800" text-anchor="start">·</text><text x="1098" y="992" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Deux commandes simultanées</text><text x="1098" y="1012" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">→ Une seule aboutit, stock jamais négatif</text></g>
<rect x="0.5" y="0.5" width="1599" height="1119" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Jalons et critères de recette  —  1600 × 1120</text>
</svg>