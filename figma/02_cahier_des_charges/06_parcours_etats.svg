<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1206" viewBox="0 0 1600 1206">
<rect width="1600" height="1206" fill="#FFFFFF"/>
<rect width="1600" height="1180" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Parcours et états</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Le chemin nominal, et ce que voit l'utilisateur quand ça ne se passe pas comme prévu.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="186" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Le parcours d'achat</text><text x="56" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Sept écrans. Chaque étape doit pouvoir être quittée et reprise sans perte.</text><rect x="56" y="252" width="186" height="62" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/><text x="149" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Accueil</text><line x1="242" y1="283" x2="274" y2="283" stroke="#E03B8B" stroke-width="2"/><text x="258" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="274" y="252" width="186" height="62" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/><text x="367" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Catalogue</text><line x1="460" y1="283" x2="492" y2="283" stroke="#E03B8B" stroke-width="2"/><text x="476" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="492" y="252" width="186" height="62" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/><text x="585" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Fiche produit</text><line x1="678" y1="283" x2="710" y2="283" stroke="#E03B8B" stroke-width="2"/><text x="694" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="710" y="252" width="186" height="62" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/><text x="803" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Panier</text><line x1="896" y1="283" x2="928" y2="283" stroke="#E03B8B" stroke-width="2"/><text x="912" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="928" y="252" width="186" height="62" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/><text x="1021" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Paiement</text><line x1="1114" y1="283" x2="1146" y2="283" stroke="#E03B8B" stroke-width="2"/><text x="1130" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="1146" y="252" width="186" height="62" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/><text x="1239" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Confirmation</text><line x1="1332" y1="283" x2="1364" y2="283" stroke="#E03B8B" stroke-width="2"/><text x="1348" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="400" text-anchor="middle">›</text><rect x="1364" y="252" width="186" height="62" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1.5"/><text x="1457" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Suivi</text><rect x="56" y="334" width="1488" height="62" rx="8" fill="#fdeef5"/><text x="80" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">Règle : un visiteur non connecté qui clique sur « Passer la commande » est redirigé vers la connexion, puis ramené exactement où il en était — panier compris.</text><text x="56" y="452" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Les états à prévoir sur chaque écran</text><text x="56" y="478" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Un écran n'est pas fini tant que ses quatre états ne sont pas dessinés.</text><rect x="56" y="518" width="358" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="518" width="358" height="46" rx="12" fill="#EFF6FF"/><text x="80" y="548" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#2563EB" font-weight="800" text-anchor="start" letter-spacing="1.2">CHARGEMENT</text><text x="80" y="596" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Squelettes gris à la place des cartes. Jamais</text><text x="80" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">de page blanche, jamais de tourniquet centré.</text><rect x="438" y="518" width="358" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="438" y="518" width="358" height="46" rx="12" fill="#F9FAFB"/><text x="462" y="548" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="800" text-anchor="start" letter-spacing="1.2">VIDE</text><text x="462" y="596" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un message qui explique, et une action pour en</text><text x="462" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">sortir : « Votre panier est vide — Découvrir le</text><text x="462" y="634" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">catalogue ».</text><rect x="820" y="518" width="358" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="518" width="358" height="46" rx="12" fill="#FEF2F2"/><text x="844" y="548" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#DC2626" font-weight="800" text-anchor="start" letter-spacing="1.2">ERREUR</text><text x="844" y="596" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Message compréhensible par un client, jamais</text><text x="844" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">technique. Toujours assorti d'une issue.</text><rect x="1202" y="518" width="358" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1202" y="518" width="358" height="46" rx="12" fill="#ECFDF5"/><text x="1226" y="548" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="800" text-anchor="start" letter-spacing="1.2">SUCCÈS</text><text x="1226" y="596" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Notification brève, non bloquante, qui confirme</text><text x="1226" y="615" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">l'action sans interrompre la navigation.</text><text x="56" y="756" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Micro-décisions déjà tranchées</text><rect x="56" y="796" width="728" height="84" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="80" y="828" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="700" text-anchor="start">Le prix</text><text x="80" y="852" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Toujours en rose, en gras, jamais barré sans que le prix promotionnel soit à côté.</text><rect x="816" y="796" width="728" height="84" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="840" y="828" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="700" text-anchor="start">Le stock</text><text x="840" y="852" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Affiché en nombre réel, pas en « disponible / indisponible ». Un client veut savoir s'il reste 1 ou 40.</text><rect x="56" y="896" width="728" height="84" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="80" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="700" text-anchor="start">L'ajout au panier</text><text x="80" y="952" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ne quitte jamais la page. Une notification confirme, le badge du panier s'incrémente.</text><rect x="816" y="896" width="728" height="84" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="840" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="700" text-anchor="start">Les images</text><text x="840" y="952" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Toujours au format 2:3 (couverture de livre). Une image manquante affiche un visuel de repli, jamais un</text><text x="840" y="969" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">cadre cassé.</text><rect x="56" y="996" width="728" height="84" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="80" y="1028" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="700" text-anchor="start">Les erreurs de formulaire</text><text x="80" y="1052" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Sous le champ concerné, en rouge, avec la règle à respecter — pas un message global en haut de page.</text><rect x="816" y="996" width="728" height="84" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="840" y="1028" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="700" text-anchor="start">Le bouton principal</text><text x="840" y="1052" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un seul par écran. S'il y en a deux, c'est que l'écran fait deux choses.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1179" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1198" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Parcours et états  —  1600 × 1180</text>
</svg>