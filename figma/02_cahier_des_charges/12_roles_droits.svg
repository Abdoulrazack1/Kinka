<g><rect x="0" y="0" width="1600" height="150" rx="0" fill="#FFFFFF"/><rect x="56" y="44" width="5" height="52" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#1a1a1a" font-weight="800" text-anchor="start">Rôles et droits</text><text x="76" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">Qui a le droit de faire quoi. Chaque ligne est vérifiée côté serveur : masquer un bouton dans l'interface n'est pas un contrôle d'accès.</text><line x1="56" y1="150" x2="1544" y2="150" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="196" width="1488" height="42" rx="4" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/><text x="78" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5b6472" font-weight="700" text-anchor="start" letter-spacing="1.1">ACTION</text><text x="1000" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#5b6472" font-weight="700" text-anchor="middle" letter-spacing="1.1">VISITEUR</text><text x="1200" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#5b6472" font-weight="700" text-anchor="middle" letter-spacing="1.1">MEMBRE CONNECTÉ</text><text x="1420" y="222" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#5b6472" font-weight="700" text-anchor="middle" letter-spacing="1.1">ADMINISTRATEUR</text><rect x="56" y="238" width="1488" height="34" rx="0" fill="#f9fafb"/><text x="78" y="260" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Parcourir le catalogue, rechercher, filtrer</text><circle cx="1000" cy="255" r="9" fill="#ECFDF5"/><