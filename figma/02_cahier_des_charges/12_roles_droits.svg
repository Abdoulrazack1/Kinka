ll="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="493" r="9" fill="#ECFDF5"/><text x="1200" y="498" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><circle cx="1420" cy="493" r="9" fill="#ECFDF5"/><text x="1420" y="498" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="510" width="1488" height="34" rx="0" fill="#f9fafb"/><text x="78" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Publier une annonce</text><circle cx="1000" cy="527" r="9" fill="#FEF2F2"/><text x="1000" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="527" r="9" fill="#ECFDF5"/><text x="1200" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><circle cx="1420" cy="527" r="9" fill="#ECFDF5"/><text x="1420" y="532" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="544" width="1488" height="34" rx="0" fill="#ffffff"/><text x="78" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Modifier ou retirer sa propre annonce</text><circle cx="1000" cy="561" r="9" fill="#FEF2F2"/><text x="1000" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="561" r="9" fill="#ECFDF5"/><text x="1200" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><circle cx="1420" cy="561" r="9" fill="#ECFDF5"/><text x="1420" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="578" width="1488" height="34" rx="0" fill="#f9fafb"/><text x="78" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Modifier ou retirer l'annonce d'un tiers</text><circle cx="1000" cy="595" r="9" fill="#FEF2F2"/><text x="1000" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="595" r="9" fill="#FEF2F2"/><text x="1200" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1420" cy="595" r="9" fill="#ECFDF5"/><text x="1420" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="612" width="1488" height="34" rx="0" fill="#ffffff"/><text x="78" y="634" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Supprimer son compte et ses données</text><circle cx="1000" cy="629" r="9" fill="#FEF2F2"/><text x="1000" y="634" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="629" r="9" fill="#ECFDF5"/><text x="1200" y="634" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><circle cx="1420" cy="629" r="9" fill="#ECFDF5"/><text x="1420" y="634" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="646" width="1488" height="34" rx="0" fill="#f9fafb"/><text x="78" y="668" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Modifier prix, stock et fiches produit</text><circle cx="1000" cy="663" r="9" fill="#FEF2F2"/><text x="1000" y="668" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="663" r="9" fill="#FEF2F2"/><text x="1200" y="668" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1420" cy="663" r="9" fill="#ECFDF5"/><text x="1420" y="668" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="680" width="1488" height="34" rx="0" fill="#ffffff"/><text x="78" y="702" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Changer le statut d'une commande</text><circle cx="1000" cy="697" r="9" fill="#FEF2F2"/><text x="1000" y="702" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="697" r="9" fill="#FEF2F2"/><text x="1200" y="702" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1420" cy="697" r="9" fill="#ECFDF5"/><text x="1420" y="702" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="714" width="1488" height="34" rx="0" fill="#f9fafb"/><text x="78" y="736" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Modérer avis et annonces</text><circle cx="1000" cy="731" r="9" fill="#FEF2F2"/><text x="1000" y="736" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="731" r="9" fill="#FEF2F2"/><text x="1200" y="736" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1420" cy="731" r="9" fill="#ECFDF5"/><text x="1420" y="736" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="748" width="1488" height="34" rx="0" fill="#ffffff"/><text x="78" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Consulter le journal d'audit</text><circle cx="1000" cy="765" r="9" fill="#FEF2F2"/><text x="1000" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="765" r="9" fill="#FEF2F2"/><text x="1200" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1420" cy="765" r="9" fill="#ECFDF5"/><text x="1420" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="782" width="1488" height="34" rx="0" fill="#f9fafb"/><text x="78" y="804" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Attribuer ou retirer le rôle administrateur</text><circle cx="1000" cy="799" r="9" fill="#FEF2F2"/><text x="1000" y="804" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1200" cy="799" r="9" fill="#FEF2F2"/><text x="1200" y="804" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#DC2626" font-weight="700" text-anchor="middle">✕</text><circle cx="1420" cy="799" r="9" fill="#ECFDF5"/><text x="1420" y="804" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="800" text-anchor="middle">✓</text><rect x="56" y="846" width="736.0" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="846" width="5" height="190" rx="2.5" fill="#E03B8B"/><text x="82" y="884" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Comment le droit est vérifié</text><circle cx="88" cy="910" r="3" fill="#E03B8B"/><text x="102" y="914" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">L'appartenance passe par la requête elle-même : une commande est lue avec « WHERE id = ? AND user_id</text><text x="102" y="932" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">= ? », pas relue puis comparée en mémoire.</text><circle cx="88" cy="954" r="3" fill="#E03B8B"/><text x="102" y="958" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le rôle est relu en base à chaque appel, jamais lu dans le jeton : un retrait de droits prend effet</text><text x="102" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">immédiatement.</text><circle cx="88" cy="998" r="3" fill="#E03B8B"/><text x="102" y="1002" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La zone d'administration est protégée en un seul point, au montage du routeur : aucune route ne peut</text><text x="102" y="1020" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">être oubliée.</text><rect x="808.0" y="846" width="736.0" height="190" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="834.0" y="884" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Ce qui est refusé, et comment</text><circle cx="840.0" cy="910" r="3" fill="#E03B8B"/><text x="854.0" y="914" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">401 — aucun jeton, ou jeton expiré : la session locale est purgée et l'utilisateur revient à la</text><text x="854.0" y="932" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">connexion.</text><circle cx="840.0" cy="954" r="3" fill="#E03B8B"/><text x="854.0" y="958" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">403 — jeton valide mais droit insuffisant : le message ne révèle pas si la ressource existe.</text><circle cx="840.0" cy="980" r="3" fill="#E03B8B"/><text x="854.0" y="984" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">404 — ressource d'un tiers : on répond « introuvable » plutôt qu'« accès refusé », qui confirmerait</text><text x="854.0" y="1002" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">son existence.</text></g>
