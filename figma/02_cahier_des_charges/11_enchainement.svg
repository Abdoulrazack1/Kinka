<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1266" viewBox="0 0 1600 1266">
<rect width="1600" height="1266" fill="#FFFFFF"/>
<rect width="1600" height="1240" fill="#FFFFFF"/>
<g><rect x="0" y="0" width="1600" height="150" rx="0" fill="#FFFFFF"/><rect x="56" y="44" width="5" height="52" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="80" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#1a1a1a" font-weight="800" text-anchor="start">Enchaînement des écrans</text><text x="76" y="112" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#5b6472" font-weight="400" text-anchor="start">Le chemin nominal, les bifurcations et les conditions qui les déclenchent. C'est le schéma exigé au titre du maquettage.</text><line x1="56" y1="150" x2="1544" y2="150" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Parcours d'achat</text><text x="56" y="216" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Chaque étape peut être quittée et reprise sans perte : le panier survit à la fermeture du navigateur comme à la connexion.</text><rect x="56" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#E03B8B" stroke-width="1.5"/><text x="151" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Accueil</text><text x="261" y="289" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#E03B8B" font-weight="400" text-anchor="middle">→</text><rect x="276" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#E03B8B" stroke-width="1.5"/><text x="371" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Catalogue</text><text x="481" y="289" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#E03B8B" font-weight="400" text-anchor="middle">→</text><rect x="496" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#E03B8B" stroke-width="1.5"/><text x="591" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Fiche produit</text><text x="701" y="289" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#E03B8B" font-weight="400" text-anchor="middle">→</text><rect x="716" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#E03B8B" stroke-width="1.5"/><text x="811" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Panier</text><text x="921" y="289" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#E03B8B" font-weight="400" text-anchor="middle">→</text><rect x="936" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#E03B8B" stroke-width="1.5"/><text x="1031" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Paiement</text><text x="1141" y="289" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#E03B8B" font-weight="400" text-anchor="middle">→</text><rect x="1156" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#E03B8B" stroke-width="1.5"/><text x="1251" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Confirmation</text><text x="1361" y="289" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#E03B8B" font-weight="400" text-anchor="middle">→</text><rect x="1376" y="250" width="190" height="62" rx="8" fill="#ffffff" stroke="#E03B8B" stroke-width="1.5"/><text x="1471" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">Suivi</text><text x="56" y="366" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Bifurcations</text><text x="56" y="392" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Une bifurcation est un écran atteint depuis une condition, pas depuis un lien de navigation.</text><rect x="56" y="430" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="430" width="4" height="100" rx="2" fill="#E03B8B"/><text x="78" y="460" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Panier → Connexion</text><text x="78" y="484" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Le visiteur valide sans être connecté</text><text x="78" y="506" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Le panier local est poussé vers le compte, puis le paiement reprend où il en était.</text><rect x="820" y="430" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="430" width="4" height="100" rx="2" fill="#E03B8B"/><text x="842" y="460" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Catalogue → Recherche</text><text x="842" y="484" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Une saisie dans le champ de recherche</text><text x="842" y="506" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Les suggestions apparaissent dès deux caractères ; entrée ouvre la page de résultats.</text><rect x="56" y="546" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="546" width="4" height="100" rx="2" fill="#E03B8B"/><text x="78" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Fiche produit → Panier</text><text x="78" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Clic sur « Ajouter au panier »</text><text x="78" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">La page n'est jamais quittée : une notification confirme, le badge s'incrémente.</text><rect x="820" y="546" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="546" width="4" height="100" rx="2" fill="#E03B8B"/><text x="842" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Paiement → Panier</text><text x="842" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Stock devenu insuffisant entre-temps</text><text x="842" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Retour au panier avec la quantité disponible indiquée article par article.</text><rect x="56" y="662" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="662" width="4" height="100" rx="2" fill="#E03B8B"/><text x="78" y="692" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Inscription → Vérification</text><text x="78" y="716" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Compte créé</text><text x="78" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Un lien à usage unique est envoyé ; le compte reste utilisable en lecture.</text><rect x="820" y="662" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="662" width="4" height="100" rx="2" fill="#E03B8B"/><text x="842" y="692" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Toute page → Connexion</text><text x="842" y="716" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Jeton expiré, réponse 401 de l'API</text><text x="842" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">La session locale est purgée en un seul point du code, puis retour à la connexion.</text><rect x="56" y="778" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="778" width="4" height="100" rx="2" fill="#E03B8B"/><text x="78" y="808" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Toute page → 404</text><text x="78" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Identifiant inexistant ou lien obsolète</text><text x="78" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">La page propose au moins deux chemins de sortie et des suggestions.</text><rect x="820" y="778" width="740" height="100" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="820" y="778" width="4" height="100" rx="2" fill="#E03B8B"/><text x="842" y="808" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="700" text-anchor="start">Compte → Accès refusé</text><text x="842" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="400" text-anchor="start">Condition : Page membre demandée sans jeton</text><text x="842" y="854" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Le garde-barrière client n'est qu'un confort : le serveur revérifie chaque appel.</text><rect x="56" y="930" width="1488" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="930" width="5" height="250" rx="2.5" fill="#E03B8B"/><text x="82" y="968" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Les quatre états à dessiner sur chaque écran</text><text x="82" y="998" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un écran n'est terminé que si ses quatre états sont dessinés. Un état oublié en maquette devient un écran blanc en production.</text><circle cx="88" cy="1022" r="3" fill="#E03B8B"/><text x="102" y="1026" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">CHARGEMENT — squelette gris aux dimensions du contenu attendu, jamais un indicateur seul qui ferait sauter la mise en page à l'arrivée des données.</text><circle cx="88" cy="1048" r="3" fill="#E03B8B"/><text x="102" y="1052" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">VIDE — un message qui explique, et une action pour en sortir : « Votre panier est vide — Découvrir le catalogue ».</text><circle cx="88" cy="1074" r="3" fill="#E03B8B"/><text x="102" y="1078" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">ERREUR — message compréhensible par un client, jamais technique, toujours assorti d'une issue.</text><circle cx="88" cy="1100" r="3" fill="#E03B8B"/><text x="102" y="1104" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">SUCCÈS — notification brève et non bloquante, qui confirme sans interrompre la navigation.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1239" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Enchaînement des écrans  —  1600 × 1240</text>
</svg>