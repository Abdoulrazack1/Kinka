t">21 écrans</text><rect x="356.8" y="190" width="284.8" height="196" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="356.8" y="190" width="284.8" height="44" rx="12" fill="#059669"/><rect x="356.8" y="218" width="284.8" height="16" rx="0" fill="#059669"/><text x="372.8" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="400" text-anchor="start">ACHAT — panier et commande</text><circle cx="378.8" cy="254" r="2.5" fill="#059669"/><text x="388.8" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Panier</text><circle cx="378.8" cy="284" r="2.5" fill="#059669"/><text x="388.8" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Paiement</text><circle cx="378.8" cy="314" r="2.5" fill="#059669"/><text x="388.8" y="318" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Confirmation de commande</text><circle cx="378.8" cy="344" r="2.5" fill="#059669"/><text x="388.8" y="348" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Suivi de commande</text><text x="372.8" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">4 écrans</text><rect x="657.6" y="190" width="284.8" height="376" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="657.6" y="190" width="284.8" height="44" rx="12" fill="#C2410C"/><rect x="657.6" y="218" width="284.8" height="16" rx="0" fill="#C2410C"/><text x="673.6" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="400" text-anchor="start">COMPTE — espace membre</text><circle cx="679.6" cy="254" r="2.5" fill="#C2410C"/><text x="689.6" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Connexion</text><circle cx="679.6" cy="284" r="2.5" fill="#C2410C"/><text x="689.6" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Inscription</text><circle cx="679.6" cy="314" r="2.5" fill="#C2410C"/><text x="689.6" y="318" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Vérification de l'adresse email</text><circle cx="679.6" cy="344" r="2.5" fill="#C2410C"/><text x="689.6" y="348" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Mot de passe oublié</text><circle cx="679.6" cy="374" r="2.5" fill="#C2410C"/><text x="689.6" y="378" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Nouveau mot de passe</text><circle cx="679.6" cy="404" r="2.5" fill="#C2410C"/><text x="689.6" y="408" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Mot de passe mis à jour</text><circle cx="679.6" cy="434" r="2.5" fill="#C2410C"/><text x="689.6" y="438" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Mon compte</text><circle cx="679.6" cy="464" r="2.5" fill="#C2410C"/><text x="689.6" y="468" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Mon compte — accès refusé</text><circle cx="679.6" cy="494" r="2.5" fill="#C2410C"/><text x="689.6" y="498" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Mes favoris</text><circle cx="679.6" cy="524" r="2.5" fill="#C2410C"/><text x="689.6" y="528" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Mes favoris — liste vide</text><text x="673.6" y="552" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">10 écrans</text><rect x="958.4000000000001" y="190" width="284.8" height="256" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="958.4000000000001" y="190" width="284.8" height="44" rx="12" fill="#7C3AED"/><rect x="958.4000000000001" y="218" width="284.8" height="16" rx="0" fill="#7C3AED"/><text x="974.4000000000001" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="400" text-anchor="start">SERVICE ET LÉGAL</text><circle cx="980.4000000000001" cy="254" r="2.5" fill="#7C3AED"/><text x="990.4000000000001" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Contact</text><circle cx="980.4000000000001" cy="284" r="2.5" fill="#7C3AED"/><text x="990.4000000000001" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Foire aux questions</text><circle cx="980.4000000000001" cy="314" r="2.5" fill="#7C3AED"/><text x="990.4000000000001" y="318" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Conditions générales d'utilisation</text><circle cx="980.4000000000001" cy="344" r="2.5" fill="#7C3AED"/><text x="990.4000000000001" y="348" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Conditions générales de vente</text><circle cx="980.4000000000001" cy="374" r="2.5" fill="#7C3AED"/><text x="990.4000000000001" y="378" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Politique de retour</text><circle cx="980.4000000000001" cy="404" r="2.5" fill="#7C3AED"/><text x="990.4000000000001" y="408" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Page introuvable</text><text x="974.4000000000001" y="432" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">6 écrans</text><rect x="1259.2" y="190" width="284.8" height="346" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1259.2" y="190" width="284.8" height="44" rx="12" fill="#E03B8B"/><rect x="1259.2" y="218" width="284.8" height="16" rx="0" fill="#E03B8B"/><text x="1275.2" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#FFFFFF" font-weight="400" text-anchor="start">BACK-OFFICE — rôle administrateur</text><circle cx="1281.2" cy="254" r="2.5" fill="#E03B8B"/><text x="1291.2" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — tableau de bord</text><circle cx="1281.2" cy="284" r="2.5" fill="#E03B8B"/><text x="1291.2" y="288" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — catalogue</text><circle cx="1281.2" cy="314" r="2.5" fill="#E03B8B"/><text x="1291.2" y="318" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — commandes</text><circle cx="1281.2" cy="344" r="2.5" fill="#E03B8B"/><text x="1291.2" y="348" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — modération des avis</text><circle cx="1281.2" cy="374" r="2.5" fill="#E03B8B"/><text x="1291.2" y="378" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — modération des annonces</text><circle cx="1281.2" cy="404" r="2.5" fill="#E03B8B"/><text x="1291.2" y="408" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — messages de contact</text><circle cx="1281.2" cy="434" r="2.5" fill="#E03B8B"/><text x="1291.2" y="438" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — newsletter</text><circle cx="1281.2" cy="464" r="2.5" fill="#E03B8B"/><text x="1291.2" y="468" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — utilisateurs</text><circle cx="1281.2" cy="494" r="2.5" fill="#E03B8B"/><text x="1291.2" y="498" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b6472" font-weight="400" text-anchor="start">Back-office — journal d'audit</text><text x="1275.2" y="522" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start">9 écrans</text><rect x="56" y="930" width="1488" height="170" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="930" width="5" height="170" rx="2.5" fill="#E03B8B"/><text x="82" y="968" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Ce que l'arborescence a tranché</text><circle cx="88" cy="994" r="3" fill="#E03B8B"/><text x="102" y="998" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La commande ne demande de compte qu'au moment de valider : un visiteur constitue son panier librement, et le retrouve après connexion.</text><circle cx="88" cy="1020" r="3" fill="#E03B8B"/><text x="102" y="1024" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les pages de catégorie ne sont pas des filtres du catalogue mais des pages à part entière : chacune porte son visuel, son texte et ses séries phares.</text><circle cx="88" cy="1046" r="3" fill="#E03B8B"/><text x="102" y="1050" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le back-office est une zone séparée, avec son propre en-tête : on ne passe jamais de la boutique à l'administration sans changement de contexte visible.</text><circle cx="88" cy="1072" r="3" fill="#E03B8B"/><text x="102" y="1076" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Trois anciennes pages ne sont conservées que comme redirections, pour ne pas casser les liens et favoris existants.</text></g>
