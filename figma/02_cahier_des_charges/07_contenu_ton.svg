<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1106" viewBox="0 0 1600 1106">
<rect width="1600" height="1106" fill="#FFFFFF"/>
<rect width="1600" height="1080" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Contenu et ton éditorial</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Comment le site parle à ses utilisateurs — y compris quand ça se passe mal.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="740" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="5" height="250" rx="2.5" fill="#E03B8B"/><text x="82" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Le ton</text><text x="82" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Direct et sobre. Le site s'adresse à des passionnés : il n'a pas besoin d'en faire trop pour montrer</text><text x="82" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">qu'il connaît le sujet.</text><circle cx="88" cy="288" r="3" fill="#E03B8B"/><text x="100" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">On dit « vous » au client, jamais « tu » — sauf dans les pages d'aide, où le tutoiement reste possible</text><text x="100" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">s'il est cohérent sur toute la page.</text><circle cx="88" cy="330" r="3" fill="#E03B8B"/><text x="100" y="334" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">On écrit « manga » au singulier comme au pluriel dans les libellés d'interface, et on garde les termes</text><text x="100" y="352" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">japonais (shônen, seinen) sans les traduire.</text><circle cx="88" cy="372" r="3" fill="#E03B8B"/><text x="100" y="376" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Pas de superlatifs commerciaux : « le meilleur », « incontournable » n'apportent rien.</text><rect x="828" y="186" width="716" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="854" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Les messages d'erreur</text><text x="854" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Trois règles, sans exception :</text><circle cx="860" cy="270" r="3" fill="#E03B8B"/><text x="872" y="274" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Dire ce qui s'est passé, en français courant. Jamais de code technique, jamais de nom de table ou</text><text x="872" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">de fonction.</text><circle cx="860" cy="312" r="3" fill="#E03B8B"/><text x="872" y="316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Dire quoi faire ensuite. Une erreur sans issue est une impasse.</text><circle cx="860" cy="336" r="3" fill="#E03B8B"/><text x="872" y="340" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ne jamais divulguer. « Email ou mot de passe incorrect » plutôt que « ce compte n'existe pas » :</text><text x="872" y="358" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">sinon le formulaire devient un moyen de découvrir les comptes.</text><text x="56" y="486" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Formulations retenues</text><text x="56" y="512" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Ces libellés sont figés : ils doivent être identiques partout où le cas se présente.</text><rect x="56" y="548" width="1488" height="44" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="80" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#6b7280" font-weight="700" text-anchor="start" letter-spacing="1.1">SITUATION</text><text x="420" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#059669" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QU'ON ÉCRIT</text><text x="1040" y="576" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QU'ON N'ÉCRIT PAS</text><rect x="56" y="592" width="1488" height="46" rx="0" fill="#f9fafb"/><text x="80" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Connexion échouée</text><text x="420" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="400" text-anchor="start">✓  Email ou mot de passe incorrect</text><text x="1040" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">✕  Ce compte n'existe pas</text><rect x="56" y="638" width="1488" height="46" rx="0" fill="#ffffff"/><text x="80" y="666" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Mot de passe oublié</text><text x="420" y="666" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="400" text-anchor="start">✓  Si cet email existe, un lien vous a été envoyé</text><text x="1040" y="666" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">✕  Aucun compte pour cet email</text><rect x="56" y="684" width="1488" height="46" rx="0" fill="#f9fafb"/><text x="80" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Stock insuffisant</text><text x="420" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="400" text-anchor="start">✓  Quantité limitée à 3 pour ce produit (stock disponible : 3)</text><text x="1040" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">✕  Erreur : stock &lt; quantité</text><rect x="56" y="730" width="1488" height="46" rx="0" fill="#ffffff"/><text x="80" y="758" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Panier vide</text><text x="420" y="758" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="400" text-anchor="start">✓  Votre panier est vide — Découvrir le catalogue</text><text x="1040" y="758" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">✕  Aucun élément</text><rect x="56" y="776" width="1488" height="46" rx="0" fill="#f9fafb"/><text x="80" y="804" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Commande d'un tiers</text><text x="420" y="804" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="400" text-anchor="start">✓  Commande introuvable</text><text x="1040" y="804" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">✕  Accès refusé à cette commande</text><rect x="56" y="822" width="1488" height="46" rx="0" fill="#ffffff"/><text x="80" y="850" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Erreur serveur</text><text x="420" y="850" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#059669" font-weight="400" text-anchor="start">✓  Une erreur est survenue, réessayez dans un instant</text><text x="1040" y="850" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">✕  Internal Server Error 500</text><rect x="56" y="892" width="1488" height="140" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="892" width="5" height="140" rx="2.5" fill="#E03B8B"/><text x="82" y="926" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Nommage et cohérence</text><circle cx="88" cy="950" r="3" fill="#E03B8B"/><text x="100" y="954" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un même objet porte le même nom partout : on dit « panier », jamais « caddie » ni « cart ». On dit « commande », jamais « order ».</text><circle cx="88" cy="974" r="3" fill="#E03B8B"/><text x="100" y="978" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les statuts de commande sont fixés : en cours, validée, préparée, expédiée, livrée, annulée. La liste est déclarée une seule fois dans le code, et l'interface la reprend telle quelle.</text><circle cx="88" cy="998" r="3" fill="#E03B8B"/><text x="100" y="1002" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les prix s'écrivent à la française : « 9,35 € », virgule décimale et espace avant l'euro.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1079" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1098" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Contenu et ton éditorial  —  1600 × 1080</text>
</svg>