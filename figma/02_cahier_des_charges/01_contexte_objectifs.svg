<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1246" viewBox="0 0 1600 1246">
<rect width="1600" height="1246" fill="#FFFFFF"/>
<rect width="1600" height="1220" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Contexte et objectifs</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Pourquoi ce site existe, ce qu'il doit atteindre, et comment on le mesure.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="740" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="5" height="300" rx="2.5" fill="#E03B8B"/><text x="82" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Le contexte</text><text x="82" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le marché du manga en France est le deuxième au monde après le Japon. L'offre en ligne est dominée par</text><text x="82" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">des enseignes généralistes, où le manga n'est qu'un rayon parmi d'autres.</text><text x="82" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Deux manques reviennent chez les lecteurs : la difficulté à retrouver un tome précis dans une série</text><text x="82" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">longue — certaines dépassent cent volumes — et l'absence de circuit fiable pour revendre les tomes déjà</text><text x="82" y="328" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">lus.</text><text x="82" y="354" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Kinka répond à ces deux besoins : un catalogue pensé pour les séries longues, et une place de marché</text><text x="82" y="372" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">d'occasion intégrée à la boutique plutôt que reléguée sur un site tiers.</text><rect x="828" y="186" width="716" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="854" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Le problème à résoudre</text><circle cx="860" cy="244" r="3" fill="#E03B8B"/><text x="872" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un lecteur qui suit une série veut acheter « le tome 47 », pas « un manga ». La navigation doit</text><text x="872" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">donc partir de la série, pas seulement du catalogue global.</text><circle cx="860" cy="286" r="3" fill="#E03B8B"/><text x="872" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Sur l'occasion, l'acheteur ne peut pas manipuler le livre : il doit voir l'état, une photo réelle</text><text x="872" y="308" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">et le vendeur.</text><circle cx="860" cy="328" r="3" fill="#E03B8B"/><text x="872" y="332" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un catalogue de plus de 3 000 références devient inutilisable sans filtres efficaces et sans</text><text x="872" y="350" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">recherche rapide.</text><text x="56" y="536" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Objectifs et indicateurs</text><text x="56" y="562" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Chaque objectif est associé à une mesure : sans mesure, on ne sait pas si c'est atteint.</text><rect x="56" y="596" width="482" height="176" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="596" width="5" height="176" rx="2.5" fill="#E03B8B"/><text x="82" y="632" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Trouver vite</text><text x="82" y="658" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Atteindre une fiche produit en 3 clics maximum depuis l'accueil.</text><rect x="82" y="714" width="430" height="38" rx="8" fill="#fdeef5"/><text x="98" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">Mesure : Profondeur de navigation ≤ 3</text><rect x="562" y="596" width="482" height="176" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="562" y="596" width="5" height="176" rx="2.5" fill="#E03B8B"/><text x="588" y="632" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Ne pas perdre le panier</text><text x="588" y="658" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Un panier constitué hors connexion doit survivre à la connexion.</text><rect x="588" y="714" width="430" height="38" rx="8" fill="#fdeef5"/><text x="604" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">Mesure : Taux de perte de panier : 0 %</text><rect x="1068" y="596" width="482" height="176" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1068" y="596" width="5" height="176" rx="2.5" fill="#E03B8B"/><text x="1094" y="632" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Ne jamais survendre</text><text x="1094" y="658" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Aucune commande ne doit dépasser le stock disponible.</text><rect x="1094" y="714" width="430" height="38" rx="8" fill="#fdeef5"/><text x="1110" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">Mesure : Stock négatif : 0 occurrence</text><rect x="56" y="796" width="482" height="176" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="796" width="5" height="176" rx="2.5" fill="#E03B8B"/><text x="82" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Rester utilisable sur mobile</text><text x="82" y="858" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Tous les parcours doivent aboutir à 390 px de large.</text><rect x="82" y="914" width="430" height="38" rx="8" fill="#fdeef5"/><text x="98" y="938" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">Mesure : 100 % des parcours testés</text><rect x="562" y="796" width="482" height="176" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="562" y="796" width="5" height="176" rx="2.5" fill="#E03B8B"/><text x="588" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Rester accessible</text><text x="588" y="858" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Contrastes conformes au niveau AA sur les deux thèmes.</text><rect x="588" y="914" width="430" height="38" rx="8" fill="#fdeef5"/><text x="604" y="938" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">Mesure : Rapport ≥ 4,5:1 sur le texte</text><rect x="1068" y="796" width="482" height="176" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1068" y="796" width="5" height="176" rx="2.5" fill="#E03B8B"/><text x="1094" y="832" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Rester autonome</text><text x="1094" y="858" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La boutique se gère sans intervention sur le code.</text><rect x="1094" y="914" width="430" height="38" rx="8" fill="#fdeef5"/><text x="1110" y="938" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">Mesure : 0 modification de code pour une tâche courante</text><rect x="56" y="1008" width="1488" height="156" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="82" y="1042" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Hors périmètre — assumé et documenté</text><circle cx="88" cy="1066" r="3" fill="#E03B8B"/><text x="100" y="1070" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le paiement bancaire réel : la conformité PCI-DSS dépasse le cadre du projet. L'étape existe et crée la commande, mais aucune donnée bancaire ne circule.</text><circle cx="88" cy="1090" r="3" fill="#E03B8B"/><text x="100" y="1094" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La gestion des retours et remboursements, la facturation comptable, et la facturation de l'abonnement premium — dont l'interface existe mais pas le prélèvement.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1219" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Contexte et objectifs  —  1600 × 1220</text>
</svg>