<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1266" viewBox="0 0 1600 1266">
<rect width="1600" height="1266" fill="#FFFFFF"/>
<rect width="1600" height="1240" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Intention et cibles</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Ce que le site doit produire comme effet, et pour qui.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="740" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="5" height="250" rx="2.5" fill="#E03B8B"/><text x="82" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">L'intention</text><text x="82" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Kinka vend des mangas neufs et d'occasion. Le site s'adresse à des lecteurs qui savent souvent ce qu'ils</text><text x="82" y="266" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">cherchent : un tome précis dans une série qu'ils suivent.</text><text x="82" y="292" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">La priorité de conception est donc la RAPIDITÉ D'ACCÈS au bon tome, avant la découverte. Tout ce qui</text><text x="82" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">rallonge le chemin entre l'arrivée et l'ajout au panier est un défaut.</text><text x="82" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le second axe est la CONFIANCE : sur un catalogue d'occasion, l'acheteur doit voir immédiatement l'état</text><text x="82" y="354" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">du livre, sa disponibilité réelle et le prix final.</text><rect x="828" y="186" width="716" height="250" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="854" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Ce que le site n'est pas</text><circle cx="860" cy="244" r="3" fill="#E03B8B"/><text x="872" y="248" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ce n'est pas un magazine : pas de longs contenus éditoriaux en page d'accueil.</text><circle cx="860" cy="268" r="3" fill="#E03B8B"/><text x="872" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ce n'est pas un réseau social : les avis et annonces existent, mais ne structurent pas la</text><text x="872" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">navigation.</text><circle cx="860" cy="310" r="3" fill="#E03B8B"/><text x="872" y="314" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ce n'est pas une marketplace généraliste : le catalogue est le cœur, les annonces entre membres</text><text x="872" y="332" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">restent une section secondaire.</text><text x="56" y="486" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">Les trois profils</text><text x="56" y="512" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Chaque écran a été pensé pour un profil précis. Un écran qui sert deux profils sert mal les deux.</text><rect x="56" y="546" width="482" height="380" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="546" width="482" height="54" rx="12" fill="#fdeef5"/><text x="82" y="578" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="800" text-anchor="start" letter-spacing="1.2">VISITEUR</text><text x="82" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="600" text-anchor="start">Il découvre ou compare.</text><circle cx="88" cy="656" r="3" fill="#E03B8B"/><text x="102" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Parcourir et filtrer le catalogue</text><circle cx="88" cy="682" r="3" fill="#E03B8B"/><text x="102" y="686" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Chercher un titre précis</text><circle cx="88" cy="708" r="3" fill="#E03B8B"/><text x="102" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Consulter une fiche et les avis</text><circle cx="88" cy="734" r="3" fill="#E03B8B"/><text x="102" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Constituer un panier local</text><rect x="78" y="806" width="438" height="96" rx="8" fill="#f3f4f6"/><text x="96" y="838" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Objectif de conception : ne jamais exiger de compte avant la</text><text x="96" y="856" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">commande.</text><rect x="562" y="546" width="482" height="380" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="562" y="546" width="482" height="54" rx="12" fill="#fdeef5"/><text x="588" y="578" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="800" text-anchor="start" letter-spacing="1.2">CLIENT CONNECTÉ</text><text x="588" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="600" text-anchor="start">Il achète et suit.</text><circle cx="594" cy="656" r="3" fill="#E03B8B"/><text x="608" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Panier conservé sur son compte</text><circle cx="594" cy="682" r="3" fill="#E03B8B"/><text x="608" y="686" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Favoris et avis</text><circle cx="594" cy="708" r="3" fill="#E03B8B"/><text x="608" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Commande et suivi de livraison</text><circle cx="594" cy="734" r="3" fill="#E03B8B"/><text x="608" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Revente d'occasion entre membres</text><rect x="584" y="806" width="438" height="96" rx="8" fill="#f3f4f6"/><text x="602" y="838" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Objectif : retrouver en deux clics ce qu'il a laissé la</text><text x="602" y="856" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">dernière fois.</text><rect x="1068" y="546" width="482" height="380" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="1068" y="546" width="482" height="54" rx="12" fill="#fdeef5"/><text x="1094" y="578" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#E03B8B" font-weight="800" text-anchor="start" letter-spacing="1.2">ADMINISTRATEUR</text><text x="1094" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="600" text-anchor="start">Il tient la boutique.</text><circle cx="1100" cy="656" r="3" fill="#E03B8B"/><text x="1114" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Catalogue : ajouter, corriger, retirer</text><circle cx="1100" cy="682" r="3" fill="#E03B8B"/><text x="1114" y="686" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Commandes : statut et suivi</text><circle cx="1100" cy="708" r="3" fill="#E03B8B"/><text x="1114" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Modération des avis et annonces</text><circle cx="1100" cy="734" r="3" fill="#E03B8B"/><text x="1114" y="738" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Rôles et journal d'audit</text><rect x="1090" y="806" width="438" height="96" rx="8" fill="#f3f4f6"/><text x="1108" y="838" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Objectif : gérer le quotidien sans jamais toucher au code.</text><rect x="56" y="966" width="1488" height="210" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="966" width="5" height="210" rx="2.5" fill="#E03B8B"/><text x="82" y="1000" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Exigences non négociables</text><circle cx="88" cy="1024" r="3" fill="#E03B8B"/><text x="100" y="1028" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Responsive — chaque écran doit rester utilisable à 390 px de large. La grille produits passe de 5 colonnes à 2, les filtres se replient, les actions principales restent atteignables au pouce.</text><circle cx="88" cy="1048" r="3" fill="#E03B8B"/><text x="100" y="1052" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Accessibilité — contrastes vérifiés au seuil WCAG AA, structure sémantique, libellés ARIA sur tout élément interactif, navigation possible au clavier.</text><circle cx="88" cy="1072" r="3" fill="#E03B8B"/><text x="100" y="1076" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Thème sombre — obligatoire, piloté par variables CSS, respectant par défaut la préférence système.</text><circle cx="88" cy="1096" r="3" fill="#E03B8B"/><text x="100" y="1100" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Sobriété — pas de bibliothèque d'interface externe : le poids des pages reste maîtrisé.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1239" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Intention et cibles  —  1600 × 1240</text>
</svg>