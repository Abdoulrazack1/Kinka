<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1426" viewBox="0 0 1600 1426">
<rect width="1600" height="1426" fill="#FFFFFF"/>
<rect width="1600" height="1400" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">CAHIER DES CHARGES  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Personas</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Quatre profils types, construits à partir des usages réels que le site doit servir.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="728" height="512" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="186" width="728" height="92" rx="12" fill="#fdeef5"/><circle cx="110" cy="232" r="28" fill="#E03B8B"/><text x="110" y="239" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle">L</text><text x="154" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">LÉA</text><text x="154" y="252" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">24 ans · étudiante · Lyon</text><text x="756" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="700" text-anchor="end">La collectionneuse</text><text x="82" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">Suit six séries en cours. Achète chaque nouveau tome dès sa sortie, souvent en occasion pour tenir</text><text x="82" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">son budget.</text><text x="82" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QU'IL OU ELLE CHERCHE</text><circle cx="88" cy="404" r="3" fill="#E03B8B"/><text x="102" y="408" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Retrouver instantanément le prochain tome</text><text x="102" y="425" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">d'une série qu'elle suit</text><circle cx="88" cy="444" r="3" fill="#E03B8B"/><text x="102" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Comparer neuf et occasion sur la même fiche</text><circle cx="88" cy="467" r="3" fill="#E03B8B"/><text x="102" y="471" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Payer le moins cher possible sans acheter un</text><text x="102" y="488" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">livre abîmé</text><text x="436" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QUI LE OU LA BLOQUE</text><circle cx="442" cy="404" r="3" fill="#DC2626"/><text x="456" y="408" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les catalogues où il faut chercher « tome 47 »</text><text x="456" y="425" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">dans une liste non triée</text><circle cx="442" cy="444" r="3" fill="#DC2626"/><text x="456" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ne pas savoir dans quel état est le livre</text><text x="456" y="465" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">d'occasion</text><circle cx="442" cy="484" r="3" fill="#DC2626"/><text x="456" y="488" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Devoir créer un compte avant même de voir le</text><text x="456" y="505" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">panier</text><rect x="82" y="566" width="676" height="62" rx="8" fill="#f3f4f6"/><rect x="82" y="566" width="4" height="62" rx="2" fill="#E03B8B"/><text x="102" y="594" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="400" text-anchor="start">« Je sais exactement ce que je veux. Je veux juste le trouver vite. »</text><text x="82" y="662" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Contexte d'usage : Mobile · 80 % de ses visites</text><rect x="816" y="186" width="728" height="512" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="816" y="186" width="728" height="92" rx="12" fill="#fdeef5"/><circle cx="870" cy="232" r="28" fill="#E03B8B"/><text x="870" y="239" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle">T</text><text x="914" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">THOMAS</text><text x="914" y="252" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">34 ans · cadre · Paris</text><text x="1516" y="228" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="700" text-anchor="end">Le néophyte</text><text x="842" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">Veut offrir un manga à son neveu. N'y connaît rien, ne sait pas par où commencer.</text><text x="842" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QU'IL OU ELLE CHERCHE</text><circle cx="848" cy="404" r="3" fill="#E03B8B"/><text x="862" y="408" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Être guidé vers des valeurs sûres</text><circle cx="848" cy="427" r="3" fill="#E03B8B"/><text x="862" y="431" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Comprendre ce qu'est un shônen, un seinen</text><circle cx="848" cy="450" r="3" fill="#E03B8B"/><text x="862" y="454" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Offrir un coffret complet plutôt qu'un tome</text><text x="862" y="471" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">isolé</text><text x="1196" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QUI LE OU LA BLOQUE</text><circle cx="1202" cy="404" r="3" fill="#DC2626"/><text x="1216" y="408" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le jargon employé sans explication</text><circle cx="1202" cy="427" r="3" fill="#DC2626"/><text x="1216" y="431" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les listes de 3 000 titres sans hiérarchie</text><circle cx="1202" cy="450" r="3" fill="#DC2626"/><text x="1216" y="454" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ne pas savoir si un tome se lit seul ou</text><text x="1216" y="471" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">suppose les précédents</text><rect x="842" y="566" width="676" height="62" rx="8" fill="#f3f4f6"/><rect x="842" y="566" width="4" height="62" rx="2" fill="#E03B8B"/><text x="862" y="594" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="400" text-anchor="start">« Je ne connais rien au manga. Montrez-moi ce qui marche. »</text><text x="842" y="662" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Contexte d'usage : Ordinateur de bureau · achat ponctuel</text><rect x="56" y="732" width="728" height="512" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="732" width="728" height="92" rx="12" fill="#fdeef5"/><circle cx="110" cy="778" r="28" fill="#E03B8B"/><text x="110" y="785" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle">K</text><text x="154" y="774" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">KARIM</text><text x="154" y="798" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">29 ans · développeur · Nantes</text><text x="756" y="774" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="700" text-anchor="end">Le revendeur</text><text x="82" y="856" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">A accumulé plusieurs centaines de tomes. Veut faire de la place et récupérer un peu d'argent.</text><text x="82" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QU'IL OU ELLE CHERCHE</text><circle cx="88" cy="950" r="3" fill="#E03B8B"/><text x="102" y="954" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Publier une annonce en moins de deux minutes</text><circle cx="88" cy="973" r="3" fill="#E03B8B"/><text x="102" y="977" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Fixer son prix et décrire l'état honnêtement</text><circle cx="88" cy="996" r="3" fill="#E03B8B"/><text x="102" y="1000" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Suivre ses annonces et les marquer vendues</text><text x="436" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QUI LE OU LA BLOQUE</text><circle cx="442" cy="950" r="3" fill="#DC2626"/><text x="456" y="954" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les formulaires interminables pour publier</text><circle cx="442" cy="973" r="3" fill="#DC2626"/><text x="456" y="977" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les plateformes généralistes où le manga se</text><text x="456" y="994" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">perd</text><circle cx="442" cy="1013" r="3" fill="#DC2626"/><text x="456" y="1017" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ne pas pouvoir modifier une annonce après</text><text x="456" y="1034" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">publication</text><rect x="82" y="1112" width="676" height="62" rx="8" fill="#f3f4f6"/><rect x="82" y="1112" width="4" height="62" rx="2" fill="#E03B8B"/><text x="102" y="1140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="400" text-anchor="start">« Si déposer une annonce prend dix minutes, je ne le fais pas. »</text><text x="82" y="1208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Contexte d'usage : Mobile et bureau · usage régulier</text><rect x="816" y="732" width="728" height="512" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="816" y="732" width="728" height="92" rx="12" fill="#fdeef5"/><circle cx="870" cy="778" r="28" fill="#E03B8B"/><text x="870" y="785" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#FFFFFF" font-weight="800" text-anchor="middle">C</text><text x="914" y="774" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#1a1a1a" font-weight="800" text-anchor="start">CAMILLE</text><text x="914" y="798" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">41 ans · gérante de la boutique</text><text x="1516" y="774" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="700" text-anchor="end">L'administratrice</text><text x="842" y="856" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">Tient la boutique au quotidien. N'est pas développeuse et ne veut pas dépendre de quelqu'un pour une</text><text x="842" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">tâche courante.</text><text x="842" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QU'IL OU ELLE CHERCHE</text><circle cx="848" cy="950" r="3" fill="#E03B8B"/><text x="862" y="954" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Corriger un prix ou un stock sans appeler</text><text x="862" y="971" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">personne</text><circle cx="848" cy="990" r="3" fill="#E03B8B"/><text x="862" y="994" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Faire passer une commande en « expédiée » et</text><text x="862" y="1011" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">saisir le suivi</text><circle cx="848" cy="1030" r="3" fill="#E03B8B"/><text x="862" y="1034" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Modérer un avis ou une annonce signalée</text><text x="1196" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#DC2626" font-weight="700" text-anchor="start" letter-spacing="1.1">CE QUI LE OU LA BLOQUE</text><circle cx="1202" cy="950" r="3" fill="#DC2626"/><text x="1216" y="954" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Devoir passer par la base de données pour une</text><text x="1216" y="971" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">correction simple</text><circle cx="1202" cy="990" r="3" fill="#DC2626"/><text x="1216" y="994" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Ne pas savoir qui a modifié quoi</text><circle cx="1202" cy="1013" r="3" fill="#DC2626"/><text x="1216" y="1017" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les interfaces d'administration qui exigent</text><text x="1216" y="1034" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">une formation</text><rect x="842" y="1112" width="676" height="62" rx="8" fill="#f3f4f6"/><rect x="842" y="1112" width="4" height="62" rx="2" fill="#E03B8B"/><text x="862" y="1140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="400" text-anchor="start">« Je dois pouvoir gérer ma boutique sans toucher au code. »</text><text x="842" y="1208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Contexte d'usage : Ordinateur de bureau · usage quotidien</text><rect x="56" y="1282" width="1488" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="1282" width="5" height="76" rx="2.5" fill="#E03B8B"/><text x="84" y="1316" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="700" text-anchor="start">Ce que ces personas ont décidé</text><text x="84" y="1340" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Léa impose la fiche série et l'affichage du stock réel. Thomas impose les sélections éditoriales de l'accueil. Karim impose un formulaire d'annonce court. Camille impose le back-office.</text></g>
<rect x="0.5" y="0.5" width="1599" height="1399" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1418" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Cahier des charges — Personas  —  1600 × 1400</text>
</svg>