<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Composants</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Les briques réutilisées d'une page à l'autre, avec leurs états.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Boutons</text><text x="56" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Toujours en forme de pilule. Un seul bouton principal par écran.</text><rect x="56" y="234" width="720" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="88" y="274" width="190" height="42" rx="21.0" fill="#d12d7d"/><text x="183.0" y="299.68" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">Ajouter au panier</text><text x="88" y="334" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Principal</text><text x="88" y="354" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">#d12d7d · 600</text><rect x="308" y="274" width="170" height="42" rx="21.0" fill="none" stroke="#E03B8B" stroke-width="1.5"/><text x="393.0" y="299.68" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#E03B8B" font-weight="600" text-anchor="middle">Voir la collection</text><text x="308" y="334" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Secondaire</text><text x="308" y="354" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">contour rose</text><rect x="508" y="274" width="150" height="42" rx="21.0" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/><text x="583.0" y="299.68" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="middle">Continuer</text><text x="508" y="334" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="600" text-anchor="start">Neutre</text><text x="508" y="354" font-family="Consolas, 'Courier New', monospace" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">fond gris</text><text x="88" y="399" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">Au survol : le bouton principal s'assombrit, se soulève de 2 px et prend l'ombre rose.</text><rect x="808" y="234" width="736" height="200" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="840" y="268" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Badges d'état</text><rect x="840" y="294" width="49.28" height="24" rx="12.0" fill="#ECFDF5"/><text x="864.64" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#059669" font-weight="600" text-anchor="middle">Neuf</text><rect x="901.28" y="294" width="76.56" height="24" rx="12.0" fill="#FFF7ED"/><text x="939.56" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#C2410C" font-weight="600" text-anchor="middle">Occasion</text><rect x="989.8399999999999" y="294" width="83.38" height="24" rx="12.0" fill="#fdeef5"/><text x="1031.53" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#E03B8B" font-weight="600" text-anchor="middle">Promotion</text><rect x="1085.2199999999998" y="294" width="97.02" height="24" rx="12.0" fill="#FEF9C3"/><text x="1133.7299999999998" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#A16207" font-weight="600" text-anchor="middle">Best-seller</text><rect x="1194.2399999999998" y="294" width="62.92" height="24" rx="12.0" fill="#f3f4f6"/><text x="1225.6999999999998" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#5b6472" font-weight="600" text-anchor="middle">Seinen</text><text x="840" y="356" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Le badge qualifie l'article : état, mise en avant commerciale ou catégorie éditoriale.</text><text x="840" y="384" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Il ne porte jamais d'action : il informe, il ne se clique pas.</text><text x="56" y="488" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Carte produit</text><text x="56" y="510" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Le composant le plus réutilisé du site : accueil, catalogue, recherche, favoris, suggestions.</text><rect x="56" y="532" width="250" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="532" width="250" height="190" rx="12" fill="#f3f4f6"/><text x="181" y="632" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="middle">couverture</text><rect x="70" y="546" width="97.02" height="24" rx="12.0" fill="#FEF9C3"/><text x="118.509999999