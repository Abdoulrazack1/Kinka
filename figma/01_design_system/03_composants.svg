e 8 px, ombre portée, bordure rose clair, image zoomée à 1,08</text><rect x="346" y="708" width="520" height="66" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="368" y="736" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#1a1a1a" font-weight="700" text-anchor="start">En rupture</text><text x="368" y="758" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">image désaturée, bouton désactivé, mention « Rupture de stock »</text><text x="910" y="506" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Champs de formulaire</text><rect x="910" y="540" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#d1d5db" stroke-width="1"/><text x="924" y="567.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">Adresse e-mail</text><text x="910" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Au repos</text><rect x="910" y="622" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#E03B8B" stroke-width="2"/><text x="924" y="650" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="400" text-anchor="start">sakura@kinka.fr</text><text x="910" y="682" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">Actif — bordure rose</text><rect x="910" y="704" width="300" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/><text x="924" y="732" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#991B1B" font-weight="400" text-anchor="start">adresse invalide</text><text x="910" y="764" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#DC2626" font-weight="400" text-anchor="start">En erreur — le message précise ce qui ne va pas</text><text x="1270" y="506" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Notifications</text><rect x="1270" y="540" width="274" height="58" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/><circle cx="1296" cy="569" r="9" fill="#059669"/><text x="1316" y="574" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Produit ajouté au panier</text><rect x="1270" y="616" width="274" height="58" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/><circle cx="1296" cy="645" r="9" fill="#DC2626"/><text x="1316" y="650" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Stock insuffisant</text><rect x="1270" y="692" width="274" height="58" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/><circle cx="1296" cy="721" r="9" fill="#2563EB"/><text x="1316" y="726" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">Un lien vous a été envoyé</text><rect x="56" y="900" width="1488" height="120" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="900" width="5" height="120" rx="2.5" fill="#E03B8B"/><text x="84" y="934" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Grille et rythme</text><text x="84" y="960" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Contenu centré, largeur maximale 1280 px, marges latérales de 28 px. Gouttière de 20 px entre les cartes.</text><text x="84" y="984" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Grille produits : 5 colonnes au-dessus de 1200 px · 4 jusqu'à 1024 px · 3 jusqu'à 768 px · 2 en 