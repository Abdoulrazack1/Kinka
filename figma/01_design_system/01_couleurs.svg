<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1206" viewBox="0 0 1600 1206">
<rect width="1600" height="1206" fill="#FFFFFF"/>
<rect width="1600" height="1180" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Couleurs</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Valeurs issues des variables CSS du site (kinka-shared.css et darkmode.css).</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Couleur de marque</text><text x="56" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Le rose est la seule couleur d'accentuation. Elle signale ce sur quoi on peut agir.</text><rect x="56" y="234" width="200" height="110" rx="8" fill="#E03B8B" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--pink</text><text x="56" y="383" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#E03B8B</text><text x="56" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Couleur de marque : liens, prix,</text><text x="56" y="417" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">éléments actifs, accents.</text><rect x="288" y="234" width="200" height="110" rx="8" fill="#d12d7d" stroke="#e5e7eb" stroke-width="1"/><text x="288" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--pink-btn</text><text x="288" y="383" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#D12D7D</text><text x="288" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Fond réel du bouton principal —</text><text x="288" y="417" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">assombri pour le contraste AA.</text><rect x="520" y="234" width="200" height="110" rx="8" fill="#c42e75" stroke="#e5e7eb" stroke-width="1"/><text x="520" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--pink-dark</text><text x="520" y="383" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#C42E75</text><text x="520" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">État survolé du bouton principal.</text><rect x="752" y="234" width="200" height="110" rx="8" fill="#f472b6" stroke="#e5e7eb" stroke-width="1"/><text x="752" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--pink-light</text><text x="752" y="383" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#F472B6</text><text x="752" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Bordure de carte au survol, éléments</text><text x="752" y="417" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">décoratifs.</text><rect x="984" y="234" width="200" height="110" rx="8" fill="#fdeef5" stroke="#e5e7eb" stroke-width="1"/><text x="984" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--pink-soft</text><text x="984" y="383" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#FDEEF5</text><text x="984" y="402" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Fond des badges et des zones mises en</text><text x="984" y="417" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">avant.</text><text x="56" y="484" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Texte et surfaces — thème clair</text><rect x="56" y="510" width="186" height="92" rx="8" fill="#1a1a1a" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--text</text><text x="56" y="641" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#1A1A1A</text><text x="56" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Titres et texte courant.</text><rect x="274" y="510" width="186" height="92" rx="8" fill="#5b6472" stroke="#e5e7eb" stroke-width="1"/><text x="274" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--text-muted</text><text x="274" y="641" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#5B6472</text><text x="274" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Texte secondaire, légendes.</text><rect x="492" y="510" width="186" height="92" rx="8" fill="#6b7280" stroke="#e5e7eb" stroke-width="1"/><text x="492" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--text-light</text><text x="492" y="641" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#6B7280</text><text x="492" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Mentions discrètes, placeholders.</text><rect x="710" y="510" width="186" height="92" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="710" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--bg / --bg-card</text><text x="710" y="641" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#FFFFFF</text><text x="710" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Fond de page et fond des cartes.</text><rect x="928" y="510" width="186" height="92" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/><text x="928" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--bg-muted</text><text x="928" y="641" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#F9FAFB</text><text x="928" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Sections alternées.</text><rect x="1146" y="510" width="186" height="92" rx="8" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/><text x="1146" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--bg-subtle</text><text x="1146" y="641" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#F3F4F6</text><text x="1146" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Champs, puces, zones inertes.</text><rect x="1364" y="510" width="186" height="92" rx="8" fill="#e5e7eb" stroke="#e5e7eb" stroke-width="1"/><text x="1364" y="622" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--border</text><text x="1364" y="641" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">#E5E7EB</text><text x="1364" y="660" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Bordure par défaut.</text><rect x="56" y="730" width="1488" height="250" rx="12" fill="#0f1117" stroke="#2a2f42" stroke-width="1"/><text x="80" y="768" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#f0f0f0" font-weight="700" text-anchor="start">Texte et surfaces — thème sombre</text><text x="80" y="790" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#8a92a1" font-weight="400" text-anchor="start">Le basculement ne change que les valeurs des variables : aucune règle CSS n'est dupliquée.</text><rect x="80" y="818" width="178" height="74" rx="8" fill="#f0f0f0" stroke="#353a52" stroke-width="1"/><text x="80" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f0f0f0" font-weight="600" text-anchor="start">--text</text><text x="80" y="931" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a0a8b4" font-weight="400" text-anchor="start">#F0F0F0</text><rect x="288" y="818" width="178" height="74" rx="8" fill="#a0a8b4" stroke="#353a52" stroke-width="1"/><text x="288" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f0f0f0" font-weight="600" text-anchor="start">--text-muted</text><text x="288" y="931" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a0a8b4" font-weight="400" text-anchor="start">#A0A8B4</text><rect x="496" y="818" width="178" height="74" rx="8" fill="#8a92a1" stroke="#353a52" stroke-width="1"/><text x="496" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f0f0f0" font-weight="600" text-anchor="start">--text-light</text><text x="496" y="931" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a0a8b4" font-weight="400" text-anchor="start">#8A92A1</text><rect x="704" y="818" width="178" height="74" rx="8" fill="#0f1117" stroke="#353a52" stroke-width="1"/><text x="704" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f0f0f0" font-weight="600" text-anchor="start">--bg</text><text x="704" y="931" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a0a8b4" font-weight="400" text-anchor="start">#0F1117</text><rect x="912" y="818" width="178" height="74" rx="8" fill="#1a1d27" stroke="#353a52" stroke-width="1"/><text x="912" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f0f0f0" font-weight="600" text-anchor="start">--bg-card</text><text x="912" y="931" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a0a8b4" font-weight="400" text-anchor="start">#1A1D27</text><rect x="1120" y="818" width="178" height="74" rx="8" fill="#1e2130" stroke="#353a52" stroke-width="1"/><text x="1120" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f0f0f0" font-weight="600" text-anchor="start">--bg-subtle</text><text x="1120" y="931" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a0a8b4" font-weight="400" text-anchor="start">#1E2130</text><rect x="1328" y="818" width="178" height="74" rx="8" fill="#2a2f42" stroke="#353a52" stroke-width="1"/><text x="1328" y="912" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#f0f0f0" font-weight="600" text-anchor="start">--border</text><text x="1328" y="931" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#a0a8b4" font-weight="400" text-anchor="start">#2A2F42</text><rect x="56" y="1026" width="1488" height="176" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="1026" width="5" height="176" rx="2.5" fill="#E03B8B"/><text x="84" y="1060" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Contrastes — pourquoi ces gris exactement</text><text x="84" y="1084" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">Les gris secondaires ont été assombris après vérification : ils passaient sous le seuil WCAG AA (4,5:1).</text><text x="84" y="1118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Thème clair</text><text x="220" y="1118" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">--text-muted</text><text x="400" y="1118" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">#6b7280 → #5b6472</text><text x="620" y="1118" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#059669" font-weight="600" text-anchor="start">4,38:1 → 5,43:1</text><text x="760" y="1118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="400" text-anchor="start">✓  conforme AA</text><text x="84" y="1144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Thème clair</text><text x="220" y="1144" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">--text-light</text><text x="400" y="1144" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">#9ca3af → #6b7280</text><text x="620" y="1144" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#059669" font-weight="600" text-anchor="start">2,54:1 → 4,83:1</text><text x="760" y="1144" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="400" text-anchor="start">✓  conforme AA</text><text x="84" y="1170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Thème sombre</text><text x="220" y="1170" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#1a1a1a" font-weight="400" text-anchor="start">--text-light</text><text x="400" y="1170" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">#6b7280 → #8a92a1</text><text x="620" y="1170" font-family="Consolas, 'Courier New', monospace" font-size="12.5" fill="#059669" font-weight="600" text-anchor="start">3,30:1 → 5,10:1</text><text x="760" y="1170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#059669" font-weight="400" text-anchor="start">✓  conforme AA</text></g>
