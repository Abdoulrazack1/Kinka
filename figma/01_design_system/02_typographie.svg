<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1146" viewBox="0 0 1600 1146">
<rect width="1600" height="1146" fill="#FFFFFF"/>
<rect width="1600" height="1120" fill="#f9fafb"/>
<g><rect x="0" y="0" width="1600" height="132" rx="0" fill="#ffffff"/><rect x="56" y="44" width="5" height="46" rx="2.5" fill="#E03B8B"/><text x="76" y="44" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#E03B8B" font-weight="700" text-anchor="start" letter-spacing="1.6">DESIGN SYSTEM  ·  KINKA.FR</text><text x="76" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#1a1a1a" font-weight="800" text-anchor="start">Typographie, rayons et ombres</text><text x="76" y="106" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="start">Une seule famille typographique sur tout le site, déclinée en graisses et en tailles.</text><line x1="56" y1="132" x2="1544" y2="132" stroke="#e5e7eb" stroke-width="1"/><text x="56" y="190" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Famille — Inter</text><text x="56" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Sans empattement, très lisible aux petites tailles. Repli : Segoe UI, puis la police système.</text><rect x="56" y="234" width="740" height="210" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="88" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="54" fill="#1a1a1a" font-weight="800" text-anchor="start">Aa</text><text x="180" y="280" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="24" fill="#1a1a1a" font-weight="700" text-anchor="start">Inter</text><text x="180" y="306" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#5b6472" font-weight="400" text-anchor="start">font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif</text><text x="88" y="356" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="400" text-anchor="start">ABCDEFGHIJKLMNOPQRSTUVWXYZ  abcdefghijklmnopqrstuvwxyz</text><text x="88" y="384" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#5b6472" font-weight="400" text-anchor="start">0123456789   € % —  « »  éèêàçùôïÉÈÀ</text><text x="88" y="416" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Graisses employées : 400 régulier · 500 moyen · 600 semi-gras · 700 gras · 800 extra-gras</text><rect x="828" y="234" width="716" height="210" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="860" y="274" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Échelle typographique</text><text x="860" y="308" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" fill="#1a1a1a" font-weight="800" text-anchor="start">Titre de page</text><text x="1240" y="306" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">h1</text><text x="1310" y="306" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">clamp(1.5rem, 3vw, 2.2rem)</text><text x="860" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" fill="#1a1a1a" font-weight="700" text-anchor="start">Titre de section</text><text x="1240" y="334" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">h2</text><text x="1310" y="334" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">1.35rem</text><text x="860" y="364" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#1a1a1a" font-weight="600" text-anchor="start">Sous-titre</text><text x="1240" y="362" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">h3</text><text x="1310" y="362" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">1.05rem</text><text x="860" y="392" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" font-weight="400" text-anchor="start">Texte courant</text><text x="1240" y="390" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">body</text><text x="1310" y="390" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">0.95rem</text><text x="860" y="420" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#1a1a1a" font-weight="400" text-anchor="start">Mention</text><text x="1240" y="418" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#E03B8B" font-weight="600" text-anchor="start">small</text><text x="1310" y="418" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">0.8rem</text><text x="56" y="496" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Rayons de bordure</text><text x="56" y="518" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Quatre valeurs seulement, pour que les composants restent cohérents entre eux.</text><rect x="56" y="540" width="170" height="88" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="141" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">8px</text><text x="56" y="652" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--radius</text><text x="56" y="671" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">champs, petits blocs</text><rect x="266" y="540" width="170" height="88" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="351" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">12px</text><text x="266" y="652" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--radius-lg</text><text x="266" y="671" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">cartes produit</text><rect x="476" y="540" width="170" height="88" rx="20" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="561" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">20px</text><text x="476" y="652" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--radius-xl</text><text x="476" y="671" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">grandes surfaces</text><rect x="686" y="540" width="170" height="88" rx="40" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/><text x="771" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#5b6472" font-weight="400" text-anchor="middle">pill</text><text x="686" y="652" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--radius-pill</text><text x="686" y="671" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start">boutons, badges, pastilles</text><text x="900" y="496" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" fill="#1a1a1a" font-weight="700" text-anchor="start">Élévation</text><text x="900" y="518" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start">Quatre niveaux d'ombre, plus une ombre rose réservée au bouton principal survolé.</text><rect x="904" y="546" width="300" height="60" rx="8" fill="#000000" opacity="0.04"/><rect x="900" y="540" width="300" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="918" y="568" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--shadow-xs</text><text x="918" y="588" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0 1px 3px rgba(0,0,0,.06)</text><rect x="1244" y="546" width="300" height="60" rx="8" fill="#000000" opacity="0.06"/><rect x="1240" y="540" width="300" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="1258" y="568" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--shadow-sm</text><text x="1258" y="588" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0 2px 8px rgba(0,0,0,.08)</text><rect x="904" y="664" width="300" height="60" rx="8" fill="#000000" opacity="0.08"/><rect x="900" y="658" width="300" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="918" y="686" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--shadow-md</text><text x="918" y="706" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0 6px 24px rgba(0,0,0,.10)</text><rect x="1244" y="664" width="300" height="60" rx="8" fill="#000000" opacity="0.1"/><rect x="1240" y="658" width="300" height="60" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><text x="1258" y="686" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#1a1a1a" font-weight="600" text-anchor="start">--shadow-lg</text><text x="1258" y="706" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">0 16px 48px rgba(0,0,0,.14)</text><rect x="56" y="1000" width="1488" height="86" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/><rect x="56" y="1000" width="5" height="86" rx="2.5" fill="#E03B8B"/><text x="84" y="1034" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#1a1a1a" font-weight="700" text-anchor="start">Mouvement</text><text x="84" y="1062" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5b6472" font-weight="400" text-anchor="start">transition : all 0.2s cubic-bezier(.4, 0, .2, 1)   —   la même courbe partout, pour que le site ait un seul « rythme ».</text></g>
<rect x="0.5" y="0.5" width="1599" height="1119" fill="none" stroke="#D4D4D4" stroke-width="1"/>
<text x="0" y="1138" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#7A7A7A">Design system — Typographie et styles  —  1600 × 1120</text>
</svg>