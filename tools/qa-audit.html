<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>QA Kinka — audit automatisé des pages</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1rem; font-size: 13px; }
  #cadre { width: 1280px; height: 800px; border: 1px solid #ccc; }
  pre { background: #f6f6f6; padding: 1rem; overflow: auto; max-height: 60vh; }
</style>
</head>
<body>
<h1>Audit QA</h1>
<p>Charge chaque page du site dans un cadre et relève : débordement horizontal,
images locales cassées, erreurs JavaScript, éléments superposés.</p>
<iframe id="cadre" src="about:blank"></iframe>
<pre id="sortie">En attente…</pre>

<script>
// Analyse exécutée à l'intérieur de chaque page chargée.
function analyser(win, doc) {
  const limite = doc.documentElement.clientWidth;
  const rapport = { debordement: null, imagesCassees: [], superpositions: [], vide: false };

  if (doc.documentElement.scrollWidth > limite + 2) {
    const coupables = [...doc.querySelectorAll('*')]
      .filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.right > limite + 2; })
      .map(el => el.tagName.toLowerCase() + '.' + String(el.className || '').split(' ')[0])
      .filter((v, i, a) => a.indexOf(v) === i);
    rapport.debordement = { largeurDoc: doc.documentElement.scrollWidth, limite, coupables: coupables.slice(0, 5) };
  }

  // images locales seulement : les couvertures distantes sont en chargement paresseux
  [...doc.querySelectorAll('img')].forEach(img => {
    const src = img.getAttribute('src') || '';
    if (/^https?:/i.test(src)) return;
    if (img.loading === 'lazy' && !img.complete) return;
    if (!(img.complete && img.naturalWidth > 0)) rapport.imagesCassees.push(src);
  });

  // superposition de blocs de texte frères (titres/paragraphes qui se chevauchent)
  const recouvre = (a, b) => a.right > b.left + 2 && a.left < b.right - 2 && a.bottom > b.top + 2 && a.top < b.bottom - 2;
  // On ignore : les éléments masqués (opacité, visibility), ceux dans un
  // conteneur positionné en fixed/absolute (bannière cookies, carrousels —
  // leur superposition est voulue), et les éléments hors flux.
  const horsFlux = (el) => {
    const rect = el.getBoundingClientRect();
    for (let n = el; n && n !== doc.body; n = n.parentElement) {
      const s = win.getComputedStyle(n);
      if (s.position === 'fixed' || s.position === 'absolute') return true;
      if (s.visibility === 'hidden' || Number(s.opacity) <= 0.5 || s.display === 'none') return true;
      // Contenu rogné par un ancêtre (accordéons repliés en max-height:0,
      // carrousels…) : il n'est pas visible même si sa boîte dépasse.
      if (n !== el && /hidden|clip/.test(s.overflow + s.overflowY)) {
        const r = n.getBoundingClientRect();
        if (rect.bottom > r.bottom + 2 || rect.top < r.top - 2) return true;
      }
    }
    return false;
  };
  const textes = [...doc.querySelectorAll('h1, h2, h3, p')]
    .filter(el => el.textContent.trim() && el.getBoundingClientRect().width > 0)
    .filter(el => !horsFlux(el));
  for (let i = 0; i < textes.length && rapport.superpositions.length < 4; i++) {
    for (let j = i + 1; j < textes.length; j++) {
      if (textes[i].contains(textes[j]) || textes[j].contains(textes[i])) continue;
      if (recouvre(textes[i].getBoundingClientRect(), textes[j].getBoundingClientRect())) {
        rapport.superpositions.push(
          textes[i].tagName + '«' + textes[i].textContent.trim().slice(0, 25) + '» ⨯ ' +
          textes[j].tagName + '«' + textes[j].textContent.trim().slice(0, 25) + '»');
        break;
      }
    }
  }

  const corps = doc.body ? doc.body.innerText.trim() : '';
  rapport.vide = corps.length < 80;
  return rapport;
}

async function auditer(pages, attente, largeur) {
  const cadre = document.getElementById('cadre');
  if (largeur) cadre.style.width = largeur + 'px';   // audit à une largeur donnée (responsive)
  const sortie = document.getElementById('sortie');
  const resultats = {};

  for (const page of pages) {
    const erreurs = [];
    await new Promise(resolve => {
      cadre.onload = () => resolve();
      cadre.src = page + (page.includes('?') ? '&' : '?') + '_qa=1';
    });
    // capture les erreurs JS de la page chargée
    cadre.contentWindow.addEventListener('error', e => erreurs.push(String(e.message)));
    await new Promise(r => setTimeout(r, attente));
    try {
      const r = analyser(cadre.contentWindow, cadre.contentDocument);
      r.erreursJs = erreurs;
      resultats[page] = r;
    } catch (e) {
      resultats[page] = { erreurAnalyse: String(e) };
    }
    sortie.textContent = 'Analysé : ' + Object.keys(resultats).length + '/' + pages.length + ' — ' + page;
  }
  return resultats;
}
window.auditer = auditer;
</script>
</body>
</html>
