<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{sujet}}</title>
</head>
<!--
  Gabarit commun à tous les emails Kinka.
  Les styles sont en ligne : les clients de messagerie (Gmail, Outlook)
  ignorent ou suppriment largement les feuilles de style externes et les
  balises <style> du <head>.
-->
<body style="margin:0;padding:0;background:#f4f4f7;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 16px">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)">

          <!-- En-tête -->
          <tr>
            <td style="background:#1a1a2e;padding:24px 32px">
              <span style="font-size:22px;font-weight:800;letter-spacing:-.5px;color:#ffffff">KINKA</span><span
                    style="font-size:22px;font-weight:800;color:#e03b8b">.FR</span>
            </td>
          </tr>

          <!-- Contenu -->
          <tr>
            <td style="padding:32px">
              {{contenu}}
            </td>
          </tr>

          <!-- Pied -->
          <tr>
            <td style="background:#fafafa;padding:20px 32px;border-top:1px solid #ececf1">
              <p style="margin:0 0 6px;font-size:12px;color:#7a7a85">
                Cet email vous a été envoyé par KINKA.FR, votre boutique manga en ligne.
              </p>
              <p style="margin:0;font-size:12px;color:#7a7a85">
                Une question ? Écrivez-nous à
                <a href="mailto:{{emailSupport}}" style="color:#e03b8b;text-decoration:none">{{emailSupport}}</a>.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
